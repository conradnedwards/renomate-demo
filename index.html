function money(n){return new Intl.NumberFormat('en-AU',{style:'currency',currency:state.settings.currency||'AUD',maximumFractionDigits:0}).format(Number(n||0))}
function dateFmt(s){if(!s)return'—';return new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'short',year:'numeric'}).format(new Date(s+'T12:00:00'))}
function daysUntil(s){if(!s)return 999;const a=new Date();a.setHours(0,0,0,0);return Math.ceil((new Date(s+'T12:00:00')-a)/86400000)}
function room(id){return state.rooms.find(x=>x.id===id)}function roomName(id){return room(id)?.name||'Whole Project'}function contractor(id){return state.contractors.find(x=>x.id===id)}
function totalBudget(){return +state.settings.baseBudget + +state.settings.contingency}
function quoteSelected(qr){return qr.quotes.find(q=>q.id===qr.selectedQuoteId)}
function forecastDeltas(roomId=null){let d=0;state.commitments.filter(x=>x.status==='Committed'&&(!roomId||x.roomId===roomId)).forEach(x=>d+=x.amount-x.allowance);state.quoteRequests.filter(x=>x.selectedQuoteId&&(!roomId||x.roomId===roomId)).forEach(x=>d+=(quoteSelected(x)?.amount||0)-x.allowance);state.selections.filter(x=>['Selected','Ordered','Received','Installed'].includes(x.status)&&(!roomId||x.roomId===roomId)).forEach(x=>d+=(x.price||x.allowance)-x.allowance);state.variations.filter(x=>x.status==='Approved'&&(!roomId||x.roomId===roomId)).forEach(x=>d+=x.amount);return d}
function forecastFinal(){return +state.settings.baseBudget+forecastDeltas()}
function committedTotal(){let n=0;state.commitments.filter(x=>x.status==='Committed').forEach(x=>n+=x.amount);state.quoteRequests.filter(x=>x.selectedQuoteId).forEach(x=>n+=quoteSelected(x)?.amount||0);state.selections.filter(x=>['Ordered','Received','Installed'].includes(x.status)).forEach(x=>n+=x.price||0);state.variations.filter(x=>x.status==='Approved').forEach(x=>n+=x.amount);return n}
function paidTotal(){return state.payments.filter(x=>x.status==='Paid').reduce((a,b)=>a+b.amount,0)}
function contingencyLeft(){return Math.max(0,totalBudget()-forecastFinal())}function overrun(){return Math.max(0,forecastFinal()-totalBudget())}
function roomForecast(id){return (room(id)?.budget||0)+forecastDeltas(id)}
function pendingVariations(){return state.variations.filter(x=>x.status==='Pending')}
function undecidedSelections(){return state.selections.filter(x=>x.status==='Shortlisted')}
function duePayments(days=14){return state.payments.filter(x=>x.status!=='Paid'&&daysUntil(x.due)<=days).sort((a,b)=>a.due.localeCompare(b.due))}
function openTasks(){return state.tasks.filter(x=>x.status!=='Done')}
function unresolvedDefects(){return state.defects.filter(x=>x.status!=='Resolved')}
function projectRisk(){if(overrun()>0)return'OVER';if(contingencyLeft()<state.settings.contingency*.25)return'WATCH';return'ON TRACK'}
function riskClass(){return projectRisk()==='OVER'?'red':projectRisk()==='WATCH'?'amber':'green'}

function renderInsights(){const biggest=state.rooms.map(r=>({name:r.name,v:roomForecast(r.id)-r.budget})).sort((a,b)=>b.v-a.v);const contractorSpend={};state.payments.filter(x=>x.status==='Paid').forEach(p=>contractorSpend[p.payee]=(contractorSpend[p.payee]||0)+p.amount);pageTitle('Insights','The story behind the numbers');$('#view').innerHTML=`<div class="grid cols4"><div class="card kpi"><span class="kpiIcon">Δ</span><div class="label">Forecast movement</div><div class="value money ${forecastFinal()>plannedRoomTotal()?'bad':'good'}">${money(forecastFinal()-plannedRoomTotal())}</div><div class="note">Above original base plan</div></div><div class="card kpi"><span class="kpiIcon sage">%</span><div class="label">Budget committed</div><div class="value">${totalBudget()?Math.round(committedTotal()/totalBudget()*100):0}%</div><div class="note">Of approved budget</div></div><div class="card kpi"><span class="kpiIcon amber">◇</span><div class="label">Open selections</div><div class="value">${undecidedSelections().length}</div><div class="note">Still need decisions</div></div><div class="card kpi"><span class="kpiIcon">!</span><div class="label">Open defects</div><div class="value">${unresolvedDefects().length}</div><div class="note">Before handover</div></div></div><div class="grid cols2 section"><div class="card"><div class="eyebrow">Budget pressure</div><h2>Rooms by forecast variance</h2>${biggest.map(x=>`<div class="metricline"><span>${esc(x.name)}</span><strong class="money ${x.v>0?'bad':'good'}">${x.v>0?'+':''}${money(x.v)}</strong></div>`).join('')}</div><div class="card"><div class="eyebrow">Cash paid</div><h2>Payments by payee</h2>${Object.entries(contractorSpend).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="metricline"><span>${esc(n)}</span><strong>${money(v)}</strong></div>`).join('')}</div></div><div class="grid cols2 section"><div class="card"><div class="eyebrow">Change control</div><h2>Variation exposure</h2><div class="metricline"><span>Approved</span><strong>${money(state.variations.filter(x=>x.status==='Approved').reduce((a,b)=>a+b.amount,0))}</strong></div><div class="metricline"><span>Pending</span><strong>${money(state.variations.filter(x=>x.status==='Pending').reduce((a,b)=>a+b.amount,0))}</strong></div><div class="metricline"><span>Approved schedule impact</span><strong>${(()=>{const d=state.variations.filter(x=>x.status==='Approved').reduce((a,b)=>a+b.days,0);return (d>0?'+':'')+d})()} days</strong></div></div><div class="card"><div class="eyebrow">Decision load</div><h2>What still needs choosing</h2>${undecidedSelections().map(x=>`<div class="metricline"><span>${esc(x.item)}<br><span class="tiny">${roomName(x.roomId)}</span></span><strong>${money(x.allowance)}</strong></div>`).join('')||'<div class="empty">All tracked selections decided.</div>'}</div></div>`}
function renderBackup(){pageTitle('Backup & Restore','Your renovation data is valuable — keep a copy outside the browser');$('#view').innerHTML=`<div class="grid cols2"><div class="card"><div class="eyebrow">Full backup</div><h2>Download everything</h2><p class="muted">Creates a JSON backup containing rooms, quotes, contractors, variations, selections, payments, timeline, decisions and defects.</p><button class="btn primary" onclick="backupNow()">Download Backup</button></div><div class="card"><div class="eyebrow">Restore</div><h2>Restore a previous backup</h2><p class="muted">RenoMate validates the file before replacing your current project.</p><input type="file" id="restoreFile" accept="application/json" onchange="restoreFile(this.files[0])"></div></div><div class="callout section"><strong>Local-first means you control the data.</strong><div class="muted">Make a backup before clearing browser data, moving computers, or making large project changes.</div></div>`}
function renderSettings(){pageTitle('Settings','Project name, budget, contingency and target date');$('#view').innerHTML=`<div class="card"><div class="formgrid"><div class="field"><label>Project name</label><input id="setName" value="${esc(state.settings.projectName)}"></div><div class="field"><label>Location</label><input id="setLocation" value="${esc(state.settings.location)}"></div><div class="field"><label>Currency</label><select id="setCurrency"><option ${state.settings.currency==='AUD'?'selected':''}>AUD</option><option ${state.settings.currency==='USD'?'selected':''}>USD</option><option ${state.settings.currency==='GBP'?'selected':''}>GBP</option><option ${state.settings.currency==='EUR'?'selected':''}>EUR</option></select></div><div class="field"><label>Approved base budget</label><input id="setBase" type="number" value="${state.settings.baseBudget}"></div><div class="field"><label>Contingency allowance</label><input id="setCont" type="number" value="${state.settings.contingency}"></div><div class="field"><label>Target completion date</label><input id="setTarget" type="date" value="${state.settings.targetDate}"></div></div><div class="callout sage section"><strong>Approved ceiling = approved base budget + contingency.</strong><div class="muted">Your live forecast starts from the sum of room allowances, so adding or changing a room can never silently diverge from the project forecast.</div></div><div class="actions section"><button class="btn primary" onclick="saveSettings()">Save Settings</button><button class="btn danger" onclick="resetDemo()">Reset Demo Data</button></div></div>`}
function renderHelp(){pageTitle('Help','The operating logic behind RenoMate');$('#view').innerHTML=`<div class="grid cols2"><div class="card"><h2>The forecast engine</h2><p class="muted">Start with room allowances. Selecting a quote or product changes the forecast by the difference between its allowance and actual price. Approved variations add their full impact. Payments do not change forecast — they only show cash paid.</p><div class="callout"><strong>That distinction is deliberate.</strong><div class="muted">“Paid” and “project cost” are not the same number.</div></div></div><div class="card"><h2>Recommended workflow</h2><div class="metricline"><span>1. Set room budgets</span><strong>Plan</strong></div><div class="metricline"><span>2. Compare and choose quotes</span><strong>Commit</strong></div><div class="metricline"><span>3. Log staged payments</span><strong>Pay</strong></div><div class="metricline"><span>4. Approve/reject changes</span><strong>Vary</strong></div><div class="metricline"><span>5. Watch final forecast</span><strong>Control</strong></div></div></div><div class="grid cols2 section"><div class="card"><h2>Selections & deliveries</h2><p class="muted">Use allowances while you are still choosing. Once an item is selected, RenoMate can forecast the price difference. Once ordered, it becomes a tracked commitment.</p></div><div class="card"><h2>Important</h2><p class="muted">RenoMate is a planning and record-keeping tool. It is not building, legal, financial or professional project-management advice. Verify contracts, payment schedules, warranties and compliance requirements independently.</p></div></div>`}
function openModal(h){$('#modal').innerHTML=h;$('#modalBack').classList.add('show')}function closeModal(){$('#modalBack').classList.remove('show')}function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2200)}
function field(l,id,v='',type='text',extra=''){return`<div class="field"><label>${l}</label><input id="${id}" type="${type}" value="${esc(v)}" ${extra}></div>`}function roomOptions(sel){return state.rooms.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.name)}</option>`).join('')}
function openRoom(id){const r=id?room(id):{id:uid(),name:'',budget:0,progress:0};openModal(`<h2>${id?'Edit':'Add'} room / project</h2><div class="formgrid">${field('Room / workstream name','rName',r.name)}${field('Original allowance','rBudget',r.budget,'number')}${field('Progress %','rProgress',r.progress,'number','min="0" max="100"')}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRoom('${r.id}')">Save</button></div>`)}
function saveRoom(id){const r=state.rooms.find(x=>x.id===id);const obj={id,name:$('#rName').value.trim(),budget:+$('#rBudget').value,progress:Math.max(0,Math.min(100,+$('#rProgress').value))};if(r)Object.assign(r,obj);else state.rooms.push(obj);save();closeModal();render();toast('Room saved')}
function openCommitment(id){const c=id?state.commitments.find(x=>x.id===id):{id:uid(),roomId:state.rooms[0].id,label:'',contractorId:state.contractors[0]?.id||'',allowance:0,amount:0,status:'Committed'};openModal(`<h2>${id?'Edit':'Add'} commitment</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="cRoom">${roomOptions(c.roomId)}</select></div>${field('Scope / commitment','cLabel',c.label)}<div class="field"><label>Contractor</label><select id="cContractor">${state.contractors.map(x=>`<option value="${x.id}" ${x.id===c.contractorId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${field('Original allowance','cAllow',c.allowance,'number')}${field('Committed amount','cAmount',c.amount,'number')}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCommitment('${c.id}')">Save commitment</button></div>`)}
function saveCommitment(id){const c=state.commitments.find(x=>x.id===id),obj={id,roomId:$('#cRoom').value,label:$('#cLabel').value.trim(),contractorId:$('#cContractor').value,allowance:+$('#cAllow').value,amount:+$('#cAmount').value,status:'Committed'};if(c)Object.assign(c,obj);else state.commitments.push(obj);save();closeModal();render();toast('Commitment saved')}
function openQuoteRequest(id){const qr=id?state.quoteRequests.find(x=>x.id===id):{id:uid(),roomId:state.rooms[0].id,scope:'',allowance:0,status:'Comparing',selectedQuoteId:null,quotes:[]};openModal(`<h2>${id?'Edit':'New'} quote request</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="qRoom">${roomOptions(qr.roomId)}</select></div>${field('Scope','qScope',qr.scope)}${field('Original allowance','qAllow',qr.allowance,'number')}</div><div class="callout section"><strong>Quote entries</strong><div class="muted">Use one line per quote as Contractor | Amount | Notes</div></div><div class="field section"><label>Quotes</label><textarea id="qQuotes">${qr.quotes.map(q=>`${q.contractor} | ${q.amount} | ${q.notes||''}`).join('\n')}</textarea></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveQuoteRequest('${qr.id}')">Save request</button></div>`)}
function saveQuoteRequest(id){const old=state.quoteRequests.find(x=>x.id===id);const quotes=$('#qQuotes').value.split(/\n+/).filter(Boolean).map((line,i)=>{const [contractor,amount,notes]=line.split('|').map(x=>x.trim());const existing=old?.quotes[i];return{id:existing?.id||uid(),contractor,amount:+amount||0,notes:notes||''}});const obj={id,roomId:$('#qRoom').value,scope:$('#qScope').value.trim(),allowance:+$('#qAllow').value,status:old?.selectedQuoteId?'Selected':'Comparing',selectedQuoteId:old?.selectedQuoteId||null,quotes};if(old)Object.assign(old,obj);else state.quoteRequests.push(obj);save();closeModal();render();toast('Quote request saved')}
function selectQuote(qrid,qid){const qr=state.quoteRequests.find(x=>x.id===qrid);qr.selectedQuoteId=qid;qr.status='Selected';save();render();toast('Quote selected — forecast updated')}function clearQuote(id){const q=state.quoteRequests.find(x=>x.id===id);q.selectedQuoteId=null;q.status='Comparing';save();render();toast('Quote selection cleared')}
function openContractor(id){const c=id?contractor(id):{id:uid(),name:'',trade:'',phone:'',email:'',rating:'Preferred'};openModal(`<h2>${id?'Edit':'Add'} contractor</h2><div class="formgrid">${field('Business / contractor name','ctName',c.name)}${field('Trade','ctTrade',c.trade)}${field('Phone','ctPhone',c.phone)}${field('Email','ctEmail',c.email,'email')}<div class="field"><label>Status</label><select id="ctRating"><option ${c.rating==='Preferred'?'selected':''}>Preferred</option><option ${c.rating==='Selected'?'selected':''}>Selected</option><option ${c.rating==='Backup'?'selected':''}>Backup</option></select></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveContractor('${c.id}')">Save</button></div>`)}
function saveContractor(id){const c=contractor(id),obj={id,name:$('#ctName').value.trim(),trade:$('#ctTrade').value.trim(),phone:$('#ctPhone').value.trim(),email:$('#ctEmail').value.trim(),rating:$('#ctRating').value};if(c)Object.assign(c,obj);else state.contractors.push(obj);save();closeModal();render();toast('Contractor saved')}
function openVariation(id){const v=id?state.variations.find(x=>x.id===id):{id:uid(),roomId:state.rooms[0].id,title:'',amount:0,days:0,status:'Pending',date:new Date().toISOString().slice(0,10),notes:''};openModal(`<h2>${id?'Edit':'Add'} variation</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="vRoom">${roomOptions(v.roomId)}</select></div>${field('Variation title','vTitle',v.title)}${field('Cost impact','vAmount',v.amount,'number')}${field('Schedule impact (days)','vDays',v.days,'number')}<div class="field"><label>Status</label><select id="vStatus"><option ${v.status==='Pending'?'selected':''}>Pending</option><option ${v.status==='Approved'?'selected':''}>Approved</option><option ${v.status==='Rejected'?'selected':''}>Rejected</option></select></div>${field('Date','vDate',v.date,'date')}<div class="field full"><label>Notes</label><textarea id="vNotes">${esc(v.notes)}</textarea></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveVariation('${v.id}')">Save variation</button></div>`)}
function saveVariation(id){const v=state.variations.find(x=>x.id===id),obj={id,roomId:$('#vRoom').value,title:$('#vTitle').value.trim(),amount:+$('#vAmount').value,days:+$('#vDays').value,status:$('#vStatus').value,date:$('#vDate').value,notes:$('#vNotes').value.trim()};if(v)Object.assign(v,obj);else state.variations.push(obj);save();closeModal();render();toast('Variation saved — forecast recalculated')}function setVariation(id,s){state.variations.find(x=>x.id===id).status=s;save();render();toast(`Variation ${s.toLowerCase()} — forecast updated`)}
function openSelection(id){const s=id?state.selections.find(x=>x.id===id):{id:uid(),roomId:state.rooms[0].id,item:'',supplier:'',allowance:0,price:0,status:'Shortlisted',due:''};openModal(`<h2>${id?'Edit':'Add'} selection</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="sRoom">${roomOptions(s.roomId)}</select></div>${field('Item / selection','sItem',s.item)}${field('Supplier','sSupplier',s.supplier)}${field('Allowance','sAllow',s.allowance,'number')}${field('Actual / selected price','sPrice',s.price,'number')}<div class="field"><label>Status</label><select id="sStatus">${['Shortlisted','Selected','Ordered','Received','Installed'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div>${field('Expected delivery','sDue',s.due,'date')}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSelection('${s.id}')">Save selection</button></div>`)}
function saveSelection(id){const s=state.selections.find(x=>x.id===id),obj={id,roomId:$('#sRoom').value,item:$('#sItem').value.trim(),supplier:$('#sSupplier').value.trim(),allowance:+$('#sAllow').value,price:+$('#sPrice').value,status:$('#sStatus').value,due:$('#sDue').value};if(s)Object.assign(s,obj);else state.selections.push(obj);save();closeModal();render();toast('Selection saved — forecast updated')}function cycleSelection(id,s){state.selections.find(x=>x.id===id).status=s;save();render();toast(`Selection marked ${s.toLowerCase()}`)}
function openDelivery(id){const d=id?state.deliveries.find(x=>x.id===id):{id:uid(),roomId:state.rooms[0].id,item:'',supplier:'',due:'',status:'Ordered'};openModal(`<h2>${id?'Edit':'Add'} delivery</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="dRoom">${roomOptions(d.roomId)}</select></div>${field('Item','dItem',d.item)}${field('Supplier','dSupplier',d.supplier)}${field('Expected date','dDue',d.due,'date')}<div class="field"><label>Status</label><select id="dStatus"><option ${d.status==='Not ordered'?'selected':''}>Not ordered</option><option ${d.status==='Ordered'?'selected':''}>Ordered</option><option ${d.status==='Received'?'selected':''}>Received</option></select></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDelivery('${d.id}')">Save</button></div>`)}
function saveDelivery(id){const d=state.deliveries.find(x=>x.id===id),obj={id,roomId:$('#dRoom').value,item:$('#dItem').value.trim(),supplier:$('#dSupplier').value.trim(),due:$('#dDue').value,status:$('#dStatus').value};if(d)Object.assign(d,obj);else state.deliveries.push(obj);save();closeModal();render();toast('Delivery saved')}function setDelivery(id,s){state.deliveries.find(x=>x.id===id).status=s;save();render();toast('Delivery updated')}
function openPayment(id){const p=id?state.payments.find(x=>x.id===id):{id:uid(),roomId:state.rooms[0].id,payee:'',label:'',amount:0,due:new Date().toISOString().slice(0,10),status:'Due'};openModal(`<h2>${id?'Edit':'Add'} payment</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="pRoom">${roomOptions(p.roomId)}</select></div>${field('Payee','pPayee',p.payee)}${field('Milestone / reason','pLabel',p.label)}${field('Amount','pAmount',p.amount,'number')}${field('Due date','pDue',p.due,'date')}<div class="field"><label>Status</label><select id="pStatus"><option ${p.status==='Due'?'selected':''}>Due</option><option ${p.status==='Paid'?'selected':''}>Paid</option></select></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePayment('${p.id}')">Save</button></div>`)}
function savePayment(id){const p=state.payments.find(x=>x.id===id),obj={id,roomId:$('#pRoom').value,payee:$('#pPayee').value.trim(),label:$('#pLabel').value.trim(),amount:+$('#pAmount').value,due:$('#pDue').value,status:$('#pStatus').value};if(p)Object.assign(p,obj);else state.payments.push(obj);save();closeModal();render();toast('Payment saved')}function markPaymentPaid(id){state.payments.find(x=>x.id===id).status='Paid';save();render();toast('Payment marked paid')}
function openTask(){const t={id:uid(),roomId:state.rooms[0].id,title:'',due:new Date().toISOString().slice(0,10),status:'Open',priority:'Medium'};openModal(`<h2>Add task</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="tRoom">${roomOptions(t.roomId)}</select></div>${field('Task','tTitle','')}${field('Due date','tDue',t.due,'date')}<div class="field"><label>Priority</label><select id="tPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTask('${t.id}')">Add task</button></div>`)}function saveTask(id){state.tasks.push({id,roomId:$('#tRoom').value,title:$('#tTitle').value.trim(),due:$('#tDue').value,status:'Open',priority:$('#tPriority').value});save();closeModal();render();toast('Task added')}function finishTask(id){state.tasks.find(x=>x.id===id).status='Done';save();render();toast('Task completed')}
function openDecision(){const d={id:uid(),roomId:state.rooms[0].id,date:new Date().toISOString().slice(0,10),title:'',decision:'',impact:0};openModal(`<h2>Log decision</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="decRoom">${roomOptions(d.roomId)}</select></div>${field('Decision title','decTitle','')}${field('Date','decDate',d.date,'date')}${field('Cost impact (optional)','decImpact',0,'number')}<div class="field full"><label>What was agreed?</label><textarea id="decText"></textarea></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDecision('${d.id}')">Log decision</button></div>`)}function saveDecision(id){state.decisions.push({id,roomId:$('#decRoom').value,date:$('#decDate').value,title:$('#decTitle').value.trim(),decision:$('#decText').value.trim(),impact:+$('#decImpact').value});save();closeModal();render();toast('Decision logged')}
function openDefect(){const d={id:uid(),roomId:state.rooms[0].id,title:'',owner:'',status:'Open',raised:new Date().toISOString().slice(0,10)};openModal(`<h2>Add defect</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="dfRoom">${roomOptions(d.roomId)}</select></div>${field('Defect','dfTitle','')}${field('Owner / contractor','dfOwner','')}${field('Raised','dfRaised',d.raised,'date')}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDefect('${d.id}')">Add defect</button></div>`)}function saveDefect(id){state.defects.push({id,roomId:$('#dfRoom').value,title:$('#dfTitle').value.trim(),owner:$('#dfOwner').value.trim(),status:'Open',raised:$('#dfRaised').value});save();closeModal();render();toast('Defect added')}function resolveDefect(id){state.defects.find(x=>x.id===id).status='Resolved';save();render();toast('Defect resolved')}
function saveSettings(){state.settings.projectName=$('#setName').value.trim()||'My Renovation';state.settings.location=$('#setLocation').value.trim();state.settings.currency=$('#setCurrency').value;state.settings.baseBudget=+$('#setBase').value;state.settings.contingency=+$('#setCont').value;state.settings.targetDate=$('#setTarget').value;save();render();toast('Settings saved')}
function backupNow(){const env={app:APP,version:VERSION,schema:state.schema,exportedAt:new Date().toISOString(),data:state};download(`RenoMate_Backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(env,null,2),'application/json');toast('Backup downloaded')}
function restoreFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.app!==APP||!x.data?.rooms)throw new Error('This is not a valid RenoMate backup.');if(!confirm(`Restore backup from ${x.exportedAt?dateFmt(x.exportedAt.slice(0,10)):'unknown date'}? Current data will be replaced.`))return;state=x.data;save();render();toast('Backup restored')}catch(e){alert(e.message)}};r.readAsText(file)}
function resetDemo(){if(!confirm('Reset RenoMate to the original demo project? This replaces current browser data.'))return;state=seed();save();render();toast('Demo data reset')}
function download(name,text,type='text/plain'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function downloadBudgetCSV(){const rows=[['Room','Original Allowance','Forecast','Variance'],...state.rooms.map(r=>[r.name,r.budget,roomForecast(r.id),roomForecast(r.id)-r.budget])];download('RenoMate_Budget_Forecast.csv',rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),'text/csv')}
window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',()=>{save();render()});
</script>

<script>
/* RenoMate GTM QA hardening — v0.5.0 RC2 */
function plannedRoomTotal(){return state.rooms.reduce((n,r)=>n+(Number(r.budget)||0),0)}
function money(n){
  const c=state.settings.currency||'AUD';
  const locale=c==='USD'?'en-US':c==='GBP'?'en-GB':c==='EUR'?'en-IE':'en-AU';
  return new Intl.NumberFormat(locale,{style:'currency',currency:c,maximumFractionDigits:0}).format(Number(n||0))
}

function quoteSelected(qr){
  if(!qr || !Array.isArray(qr.quotes) || !qr.selectedQuoteId)return undefined;
  return qr.quotes.find(q=>q.id===qr.selectedQuoteId);
}
function forecastDeltas(roomId=null){
  let d=0;
  state.commitments.filter(x=>x.status==='Committed'&&(!roomId||x.roomId===roomId)).forEach(x=>d+=(Number(x.amount)||0)-(Number(x.allowance)||0));
  state.quoteRequests.filter(x=>x.selectedQuoteId&&(!roomId||x.roomId===roomId)).forEach(x=>{const q=quoteSelected(x);if(q)d+=(Number(q.amount)||0)-(Number(x.allowance)||0)});
  state.selections.filter(x=>['Selected','Ordered','Received','Installed'].includes(x.status)&&(!roomId||x.roomId===roomId)).forEach(x=>d+=(Number(x.price)||Number(x.allowance)||0)-(Number(x.allowance)||0));
  state.variations.filter(x=>x.status==='Approved'&&(!roomId||x.roomId===roomId)).forEach(x=>d+=Number(x.amount)||0);
  return d;
}
function forecastFinal(){return plannedRoomTotal()+forecastDeltas()}
function committedTotal(){
  let n=0;
  state.commitments.filter(x=>x.status==='Committed').forEach(x=>n+=Number(x.amount)||0);
  state.quoteRequests.filter(x=>x.selectedQuoteId).forEach(x=>{const q=quoteSelected(x);if(q)n+=Number(q.amount)||0});
  state.selections.filter(x=>['Ordered','Received','Installed'].includes(x.status)).forEach(x=>n+=Number(x.price)||0);
  state.variations.filter(x=>x.status==='Approved').forEach(x=>n+=Number(x.amount)||0);
  return n;
}
function forecastDriverLines(){
  const lines=[];
  state.commitments.filter(x=>x.status==='Committed'&&x.amount!==x.allowance).forEach(x=>lines.push([x.label,(Number(x.amount)||0)-(Number(x.allowance)||0)]));
  state.quoteRequests.filter(x=>x.selectedQuoteId).forEach(x=>{const q=quoteSelected(x);if(!q)return;const d=(Number(q.amount)||0)-(Number(x.allowance)||0);if(d)lines.push([x.scope,d])});
  state.selections.filter(x=>['Selected','Ordered','Received','Installed'].includes(x.status)).forEach(x=>{const d=(Number(x.price)||Number(x.allowance)||0)-(Number(x.allowance)||0);if(d)lines.push([x.item,d])});
  state.variations.filter(x=>x.status==='Approved').forEach(x=>lines.push([`Variation: ${x.title}`,Number(x.amount)||0]));
  return lines.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,10).map(x=>`<div class="metricline"><span>${esc(x[0])}</span><strong class="money ${x[1]>0?'bad':'good'}">${x[1]>0?'+':''}${money(x[1])}</strong></div>`).join('');
}
function finiteNum(v){const n=Number(v);return Number.isFinite(n)?n:null}
function requireText(id,label){const v=$(id).value.trim();if(!v){alert(`${label} is required.`);$(id).focus();return null}return v}
function nonNegative(id,label){const n=finiteNum($(id).value);if(n===null||n<0){alert(`${label} must be zero or greater.`);$(id).focus();return null}return n}
function anyNumber(id,label){const n=finiteNum($(id).value);if(n===null){alert(`${label} must be a valid number.`);$(id).focus();return null}return n}

function saveRoom(id){
  const name=requireText('#rName','Room / workstream name'); if(name===null)return;
  const budget=nonNegative('#rBudget','Original allowance'); if(budget===null)return;
  const progress=finiteNum($('#rProgress').value);
  if(progress===null||progress<0||progress>100){alert('Progress must be between 0 and 100.');$('#rProgress').focus();return}
  const r=state.rooms.find(x=>x.id===id),obj={id,name,budget,progress};
  if(r)Object.assign(r,obj);else state.rooms.push(obj);
  save();closeModal();render();toast('Room saved — forecast recalculated');
}
function saveCommitment(id){
  const label=requireText('#cLabel','Scope / commitment');if(label===null)return;
  const allowance=nonNegative('#cAllow','Original allowance');if(allowance===null)return;
  const amount=nonNegative('#cAmount','Committed amount');if(amount===null)return;
  const c=state.commitments.find(x=>x.id===id),obj={id,roomId:$('#cRoom').value,label,contractorId:$('#cContractor').value,allowance,amount,status:'Committed'};
  if(c)Object.assign(c,obj);else state.commitments.push(obj);
  save();closeModal();render();toast('Commitment saved — forecast recalculated');
}
function saveQuoteRequest(id){
  const scope=requireText('#qScope','Scope');if(scope===null)return;
  const allowance=nonNegative('#qAllow','Original allowance');if(allowance===null)return;
  const old=state.quoteRequests.find(x=>x.id===id);
  const oldSelected=old?quoteSelected(old):null;
  const lines=$('#qQuotes').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const quotes=[];
  for(const line of lines){
    const parts=line.split('|').map(x=>x.trim());
    const contractorName=parts[0]||'';
    const amount=finiteNum(parts[1]);
    if(!contractorName||amount===null||amount<0){alert(`Invalid quote line:\n${line}\n\nUse: Contractor | Amount | Notes`);return}
    const prior=(old?.quotes||[]).find(q=>q.contractor.toLowerCase()===contractorName.toLowerCase());
    quotes.push({id:prior?.id||uid(),contractor:contractorName,amount,notes:parts.slice(2).join(' | ')||''});
  }
  let selectedQuoteId=null;
  if(oldSelected){
    const kept=quotes.find(q=>q.contractor.toLowerCase()===oldSelected.contractor.toLowerCase());
    selectedQuoteId=kept?.id||null;
  }
  const obj={id,roomId:$('#qRoom').value,scope,allowance,status:selectedQuoteId?'Selected':'Comparing',selectedQuoteId,quotes};
  if(old)Object.assign(old,obj);else state.quoteRequests.push(obj);
  save();closeModal();render();
  toast(selectedQuoteId?'Quote request saved — selected quote preserved':'Quote request saved');
}
function saveContractor(id){
  const name=requireText('#ctName','Business / contractor name');if(name===null)return;
  const c=contractor(id),obj={id,name,trade:$('#ctTrade').value.trim(),phone:$('#ctPhone').value.trim(),email:$('#ctEmail').value.trim(),rating:$('#ctRating').value};
  if(c)Object.assign(c,obj);else state.contractors.push(obj);save();closeModal();render();toast('Contractor saved')
}
function saveVariation(id){
  const title=requireText('#vTitle','Variation title');if(title===null)return;
  const amount=anyNumber('#vAmount','Cost impact');if(amount===null)return;
  const days=anyNumber('#vDays','Schedule impact');if(days===null)return;
  const v=state.variations.find(x=>x.id===id),obj={id,roomId:$('#vRoom').value,title,amount,days,status:$('#vStatus').value,date:$('#vDate').value,notes:$('#vNotes').value.trim()};
  if(v)Object.assign(v,obj);else state.variations.push(obj);save();closeModal();render();toast('Variation saved — forecast recalculated')
}
function saveSelection(id){
  const item=requireText('#sItem','Item / selection');if(item===null)return;
  const allowance=nonNegative('#sAllow','Allowance');if(allowance===null)return;
  const price=nonNegative('#sPrice','Actual / selected price');if(price===null)return;
  const s=state.selections.find(x=>x.id===id),obj={id,roomId:$('#sRoom').value,item,supplier:$('#sSupplier').value.trim(),allowance,price,status:$('#sStatus').value,due:$('#sDue').value};
  if(s)Object.assign(s,obj);else state.selections.push(obj);save();closeModal();render();toast('Selection saved — forecast updated')
}
function saveDelivery(id){
  const item=requireText('#dItem','Item');if(item===null)return;
  const d=state.deliveries.find(x=>x.id===id),obj={id,roomId:$('#dRoom').value,item,supplier:$('#dSupplier').value.trim(),due:$('#dDue').value,status:$('#dStatus').value};
  if(d)Object.assign(d,obj);else state.deliveries.push(obj);save();closeModal();render();toast('Delivery saved')
}
function savePayment(id){
  const payee=requireText('#pPayee','Payee');if(payee===null)return;
  const label=requireText('#pLabel','Milestone / reason');if(label===null)return;
  const amount=nonNegative('#pAmount','Amount');if(amount===null)return;
  const p=state.payments.find(x=>x.id===id),obj={id,roomId:$('#pRoom').value,payee,label,amount,due:$('#pDue').value,status:$('#pStatus').value};
  if(p)Object.assign(p,obj);else state.payments.push(obj);save();closeModal();render();toast('Payment saved')
}
function saveTask(id){
  const title=requireText('#tTitle','Task');if(title===null)return;
  state.tasks.push({id,roomId:$('#tRoom').value,title,due:$('#tDue').value,status:'Open',priority:$('#tPriority').value});save();closeModal();render();toast('Task added')
}
function saveDecision(id){
  const title=requireText('#decTitle','Decision title');if(title===null)return;
  const decision=requireText('#decText','Decision');if(decision===null)return;
  const impact=anyNumber('#decImpact','Cost impact');if(impact===null)return;
  state.decisions.push({id,roomId:$('#decRoom').value,date:$('#decDate').value,title,decision,impact});save();closeModal();render();toast('Decision logged')
}
function saveDefect(id){
  const title=requireText('#dfTitle','Defect');if(title===null)return;
  state.defects.push({id,roomId:$('#dfRoom').value,title,owner:$('#dfOwner').value.trim(),status:'Open',raised:$('#dfRaised').value});save();closeModal();render();toast('Defect added')
}
function saveSettings(){
  const base=nonNegative('#setBase','Approved base budget');if(base===null)return;
  const cont=nonNegative('#setCont','Contingency allowance');if(cont===null)return;
  state.settings.projectName=$('#setName').value.trim()||'My Renovation';
  state.settings.location=$('#setLocation').value.trim();
  state.settings.currency=$('#setCurrency').value;
  state.settings.baseBudget=base;
  state.settings.contingency=cont;
  state.settings.targetDate=$('#setTarget').value;
  save();render();toast('Settings saved')
}

function normaliseState(d){
  if(!d||!Array.isArray(d.quoteRequests))return d;
  d.schema=2;
  d.quoteRequests.forEach(qr=>{
    if(!Array.isArray(qr.quotes))qr.quotes=[];
    if(qr.selectedQuoteId&&!qr.quotes.some(q=>q.id===qr.selectedQuoteId)){qr.selectedQuoteId=null;qr.status='Comparing'}
  });
  return d
}
state=normaliseState(state);
function validStateData(d){
  if(!d||typeof d!=='object'||!d.settings||!Array.isArray(d.rooms))return false;
  const arrays=['rooms','contractors','commitments','quoteRequests','selections','variations','payments','tasks','decisions','deliveries','milestones','defects'];
  if(!arrays.every(k=>Array.isArray(d[k])))return false;
  if(!d.settings.projectName||!Number.isFinite(Number(d.settings.baseBudget))||!Number.isFinite(Number(d.settings.contingency)))return false;
  return true;
}
function backupEnvelope(){return {app:APP,version:VERSION,schema:2,exportedAt:new Date().toISOString(),data:state}}
function safetyBackup(prefix='RenoMate_Safety_Backup'){
  download(`${prefix}_${new Date().toISOString().replace(/[:.]/g,'-')}.json`,JSON.stringify(backupEnvelope(),null,2),'application/json')
}
function backupNow(){download(`RenoMate_Backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(backupEnvelope(),null,2),'application/json');toast('Backup downloaded')}
function restoreFile(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(x.app!==APP||!validStateData(x.data))throw new Error('This is not a valid RenoMate backup.');
      if(!confirm(`Restore backup from ${x.exportedAt?dateFmt(x.exportedAt.slice(0,10)):'unknown date'}?\n\nA safety backup of your current project will download first.`))return;
      safetyBackup();
      state=normaliseState(x.data);
      state.schema=2;
      save();render();toast('Backup restored');
    }catch(e){alert(e.message)}
  };
  r.readAsText(file)
}
function resetDemo(){
  if(!confirm('Load the original RenoMate demo project?\n\nA safety backup of your current project will download first.'))return;
  safetyBackup();
  state=seed();state.schema=2;save();render();toast('Demo project loaded')
}
function freshState(opts){
  const base=Number(opts.base)||0, cont=Number(opts.cont)||0;
  return {
    schema:2,
    settings:{projectName:opts.name||'My Renovation',location:opts.location||'',currency:opts.currency||'AUD',baseBudget:base,contingency:cont,startDate:new Date().toISOString().slice(0,10),targetDate:opts.target||''},
    rooms:[{id:'whole',name:'Whole Project',budget:base,progress:0}],
    contractors:[],commitments:[],quoteRequests:[],selections:[],variations:[],payments:[],tasks:[],decisions:[],deliveries:[],milestones:[],defects:[]
  }
}
function openFreshProjectSetup(fromExisting=false){
  openModal(`<h2>${fromExisting?'Start a new project':'Welcome to RenoMate'}</h2>
  <p class="muted">${fromExisting?'This replaces the current project after downloading a safety backup.':'Explore the demo, or create your renovation with a clean project.'}</p>
  <div class="onboard-grid section">
    <div class="field"><label>Project name</label><input id="freshName" value="My Renovation"></div>
    <div class="field"><label>Location</label><input id="freshLocation" placeholder="Optional"></div>
    <div class="field"><label>Currency</label><select id="freshCurrency"><option>AUD</option><option>USD</option><option>GBP</option><option>EUR</option></select></div>
    <div class="field"><label>Approved base budget</label><input id="freshBase" type="number" min="0" value="100000"></div>
    <div class="field"><label>Contingency allowance</label><input id="freshCont" type="number" min="0" value="10000"></div>
    <div class="field"><label>Target completion</label><input id="freshTarget" type="date"></div>
  </div>
  <div class="callout sage section"><strong>Start simple.</strong><div class="muted">RenoMate creates one Whole Project allowance. Add rooms or workstreams when you are ready; the live forecast will always reconcile to those room allowances.</div></div>
  <div class="modalfoot">
    ${!fromExisting?'<button class="btn" onclick="closeModal();save()">Explore Demo</button>':'<button class="btn" onclick="closeModal()">Cancel</button>'}
    <button class="btn terr" onclick="startFreshProject(${fromExisting?'true':'false'})">Start Fresh Project</button>
  </div>`)
}
function startFreshProject(fromExisting=false){
  const base=nonNegative('#freshBase','Approved base budget');if(base===null)return;
  const cont=nonNegative('#freshCont','Contingency allowance');if(cont===null)return;
  const name=$('#freshName').value.trim()||'My Renovation';
  if(fromExisting)safetyBackup();
  state=freshState({name,location:$('#freshLocation').value.trim(),currency:$('#freshCurrency').value,base,cont,target:$('#freshTarget').value});
  save();closeModal();location.hash='#dashboard';render();toast('Fresh renovation project created')
}

const _renderBudgetGTM=renderBudget;
renderBudget=function(){
  _renderBudgetGTM();
  const allocated=plannedRoomTotal(),approved=Number(state.settings.baseBudget)||0,gap=approved-allocated;
  const block=`<div class="card section"><div class="panelhead"><div><div class="eyebrow">Room allocation check</div><h2>${gap===0?'Room plan reconciled':gap>0?'Budget still unallocated':'Room plan exceeds approved base'}</h2></div>${badge(gap===0?'Reconciled':gap>0?`${money(gap)} unallocated`:`${money(Math.abs(gap))} over base`,gap===0?'green':gap>0?'amber':'red')}</div><div class="metricline"><span>Approved base budget</span><strong>${money(approved)}</strong></div><div class="metricline"><span>Allocated across rooms</span><strong>${money(allocated)}</strong></div><div class="metricline"><span>Difference</span><strong class="money ${gap<0?'bad':gap>0?'warn':'good'}">${gap>0?'+':''}${money(gap)}</strong></div><div class="qa-note">The project forecast starts from room allowances, so room edits can never silently disappear from the forecast.</div></div>
  <div class="card section"><div class="panelhead"><div><div class="eyebrow">Accepted commitments</div><h2>Committed work you can still edit</h2></div><button class="btn small" onclick="openCommitment()">+ Add Commitment</button></div>${state.commitments.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Scope</th><th>Room</th><th>Allowance</th><th>Committed</th><th>Variance</th><th></th></tr></thead><tbody>${state.commitments.map(c=>{const v=(Number(c.amount)||0)-(Number(c.allowance)||0);return`<tr><td><strong>${esc(c.label)}</strong></td><td>${esc(roomName(c.roomId))}</td><td>${money(c.allowance)}</td><td>${money(c.amount)}</td><td><strong class="money ${v>0?'bad':'good'}">${v>0?'+':''}${money(v)}</strong></td><td class="num"><button class="btn small" onclick="openCommitment('${c.id}')">Edit</button> <button class="btn small" onclick="deleteCommitment('${c.id}')">Delete</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No accepted commitments yet.</div>'}</div>`;
  $('#view').insertAdjacentHTML('beforeend',block)
};
pages.budget=renderBudget;

function deleteCommitment(id){
  const c=state.commitments.find(x=>x.id===id);if(!c)return;
  if(!confirm(`Delete commitment "${c.label}"? This will recalculate the forecast.`))return;
  state.commitments=state.commitments.filter(x=>x.id!==id);save();render();toast('Commitment deleted — forecast recalculated')
}
function deleteQuoteRequest(id){
  const q=state.quoteRequests.find(x=>x.id===id);if(!q)return;
  if(!confirm(`Delete quote package "${q.scope}"?`))return;
  state.quoteRequests=state.quoteRequests.filter(x=>x.id!==id);save();render();toast('Quote package deleted')
}
function deleteVariation(id){
  const v=state.variations.find(x=>x.id===id);if(!v)return;
  if(!confirm(`Delete variation "${v.title}"? The forecast will be recalculated.`))return;
  state.variations=state.variations.filter(x=>x.id!==id);save();render();toast('Variation deleted — forecast recalculated')
}
function deleteSelection(id){
  const s=state.selections.find(x=>x.id===id);if(!s)return;
  if(!confirm(`Delete selection "${s.item}"? The forecast will be recalculated.`))return;
  state.selections=state.selections.filter(x=>x.id!==id);save();render();toast('Selection deleted — forecast recalculated')
}


const _renderContractorsGTM=renderContractors;
renderContractors=function(){
  _renderContractorsGTM();
  if(!state.contractors.length)$('#view').innerHTML=`<div class="empty"><h2>No contractors yet</h2><p>Add builders, trades and suppliers as they enter the project.</p><button class="btn primary" onclick="openContractor()">+ Add Contractor</button></div>`
};
pages.contractors=renderContractors;

const _renderQuotesGTM=renderQuotes;
renderQuotes=function(){
  _renderQuotesGTM();
  if(!state.quoteRequests.length)$('#view').insertAdjacentHTML('beforeend',`<div class="empty section"><h2>No quote packages yet</h2><p>Add a scope and compare contractor prices against its original allowance.</p><button class="btn terr" onclick="openQuoteRequest()">+ New Quote Request</button></div>`);
  document.querySelectorAll('.quoteArena').forEach((card,i)=>{
    const q=state.quoteRequests[i]; if(!q)return;
    const actions=card.querySelector('.actions.section');
    if(actions&&!actions.querySelector('.gtm-delete'))actions.insertAdjacentHTML('beforeend',`<button class="btn small gtm-delete" onclick="deleteQuoteRequest('${q.id}')">Delete package</button>`)
  })
};
pages.quotes=renderQuotes;

const _renderVariationsGTM=renderVariations;
renderVariations=function(){
  _renderVariationsGTM();
  document.querySelectorAll('.variationRow').forEach(row=>{
    const edit=row.querySelector('button[onclick^="openVariation"]');if(!edit)return;
    const m=edit.getAttribute('onclick').match(/'([^']+)'/);if(m)edit.insertAdjacentHTML('afterend',` <button class="btn small" onclick="deleteVariation('${m[1]}')">Delete</button>`)
  })
};
pages.variations=renderVariations;

const _renderSelectionsGTM=renderSelections;
renderSelections=function(){
  _renderSelectionsGTM();
  if(!state.selections.length)$('#view').insertAdjacentHTML('beforeend',`<div class="empty section"><h2>No selections yet</h2><p>Add fixtures, finishes, appliances or materials and track allowance drift through ordering and delivery.</p><button class="btn terr" onclick="openSelection()">+ Add Selection</button></div>`);
  document.querySelectorAll('.selectionCard').forEach(card=>{
    const edit=card.querySelector('button[onclick^="openSelection"]');if(!edit)return;
    const m=edit.getAttribute('onclick').match(/'([^']+)'/);if(m)edit.insertAdjacentHTML('afterend',` <button class="btn small" onclick="deleteSelection('${m[1]}')">Delete</button>`)
  })
};
pages.selections=renderSelections;

renderBackup=function(){
  pageTitle('Backup & Restore','Your renovation data is valuable — keep a copy outside the browser');
  $('#view').innerHTML=`<div class="grid cols2"><div class="card"><div class="eyebrow">Full backup</div><h2>Download everything</h2><p class="muted">Creates a validated JSON backup containing your entire renovation project.</p><button class="btn primary" onclick="backupNow()">Download Backup</button></div><div class="card"><div class="eyebrow">Safe restore</div><h2>Restore a previous backup</h2><p class="muted">RenoMate validates the backup and automatically downloads a safety copy of the current project before replacing it.</p><input type="file" id="restoreFile" accept="application/json" onchange="restoreFile(this.files[0])"></div></div><div class="callout section"><strong>Local-first means you control the data.</strong><div class="muted">Back up before clearing browser data, moving computers, or making major project changes.</div></div>`;
};
pages.backup=renderBackup;

renderSettings=function(){
  pageTitle('Settings','Project identity, approved budget ceiling and target date');
  $('#view').innerHTML=`<div class="card"><div class="formgrid"><div class="field"><label>Project name</label><input id="setName" value="${esc(state.settings.projectName)}"></div><div class="field"><label>Location</label><input id="setLocation" value="${esc(state.settings.location)}"></div><div class="field"><label>Currency</label><select id="setCurrency"><option ${state.settings.currency==='AUD'?'selected':''}>AUD</option><option ${state.settings.currency==='USD'?'selected':''}>USD</option><option ${state.settings.currency==='GBP'?'selected':''}>GBP</option><option ${state.settings.currency==='EUR'?'selected':''}>EUR</option></select></div><div class="field"><label>Approved base budget</label><input id="setBase" type="number" min="0" value="${state.settings.baseBudget}"></div><div class="field"><label>Contingency allowance</label><input id="setCont" type="number" min="0" value="${state.settings.contingency}"></div><div class="field"><label>Target completion date</label><input id="setTarget" type="date" value="${state.settings.targetDate||''}"></div></div><div class="callout sage section"><strong>Approved ceiling = approved base budget + contingency.</strong><div class="muted">The live forecast starts from the sum of room allowances. Budget & Forecast shows any amount that is still unallocated or already exceeds the approved base.</div></div><div class="actions section"><button class="btn primary" onclick="saveSettings()">Save Settings</button><button class="btn" onclick="openFreshProjectSetup(true)">Start New Project</button><button class="btn danger" onclick="resetDemo()">Load Demo Data</button></div></div>`;
};
pages.settings=renderSettings;

const _downloadBudgetCSV=downloadBudgetCSV;
downloadBudgetCSV=function(){
  const rows=[
    ['RenoMate Budget & Forecast','','',''],
    ['Approved Base Budget',state.settings.baseBudget,'',''],
    ['Contingency',state.settings.contingency,'',''],
    ['Approved Ceiling',totalBudget(),'',''],
    ['Room Plan',plannedRoomTotal(),'',''],
    ['Forecast Final',forecastFinal(),'',''],
    ['Committed',committedTotal(),'',''],
    ['Paid',paidTotal(),'',''],
    [],
    ['Room','Original Allowance','Forecast','Variance'],
    ...state.rooms.map(r=>[r.name,r.budget,roomForecast(r.id),roomForecast(r.id)-r.budget])
  ];
  download('RenoMate_Budget_Forecast.csv',rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n'),'text/csv')
};

window.addEventListener('DOMContentLoaded',()=>{if(!HAD_SAVED_STATE)setTimeout(()=>openFreshProjectSetup(false),50)});
</script>


<style>
.quoteDraftRows{display:grid;gap:10px;margin-top:10px}
.quoteDraftRow{display:grid;grid-template-columns:minmax(180px,1.15fr) minmax(120px,.55fr) minmax(220px,1.35fr) 40px;gap:9px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbf9f5}
.quoteDraftRow .field{min-width:0}
.restorePreview{margin-top:14px;padding:15px;border:1px solid #cfe1d7;background:#f0f7f3;border-radius:13px}
.restorePreview .metricline{border-bottom-color:#d9e7df}

@media(max-width:900px){.quoteDraftRow{grid-template-columns:1fr 120px}.quoteDraftRow .field:nth-child(3){grid-column:1/-1}.quoteDraftRow .iconbtn{grid-column:2;grid-row:1;justify-self:end}}

<script>
/* RenoMate UAT findings — v0.5 RC2 */

// ---- Date format preference -------------------------------------------------
if(!state.settings.dateFormat) state.settings.dateFormat = state.settings.currency==='USD'?'MDY':'DMY';
save();
function dateFormatLabel(v){return ({DMY:'DD/MM/YYYY — UK / Australia',MDY:'MM/DD/YYYY — US',ISO:'YYYY-MM-DD — ISO',LONG:'28 Sep 2026 — Unambiguous'})[v]||'DD/MM/YYYY — UK / Australia'}
dateFmt=function(s){
  if(!s)return '—';
  const raw=String(s).slice(0,10), m=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m)return raw;
  const [,y,mo,d]=m, fmt=state.settings.dateFormat||'DMY';
  if(fmt==='MDY')return `${mo}/${d}/${y}`;
  if(fmt==='ISO')return `${y}-${mo}-${d}`;
  if(fmt==='LONG')return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date(`${y}-${mo}-${d}T12:00:00`));
  return `${d}/${mo}/${y}`;
};

// ---- Reusable contractor / supplier pick lists -----------------------------
function contractorNames(){return [...new Set((state.contractors||[]).map(x=>x.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function partyNames(){return [...new Set([
  ...contractorNames(),
  ...(state.payments||[]).map(x=>x.payee),
  ...(state.selections||[]).map(x=>x.supplier),
  ...(state.deliveries||[]).map(x=>x.supplier),
  ...(state.defects||[]).map(x=>x.owner)
].filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function dataListHtml(id,names){return `<datalist id="${id}">${names.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>`}
function partyInput(label,id,value='',contractorsOnly=false,placeholder='Start typing or choose from the list'){
  const listId=`${id}List`, names=contractorsOnly?contractorNames():partyNames();
  return `<div class="field"><label>${label}</label><input id="${id}" list="${listId}" value="${esc(value||'')}" placeholder="${placeholder}">${dataListHtml(listId,names)}</div>`;
}

// ---- Quote request UX -------------------------------------------------------
let _quoteDraft=[];
function captureQuoteDraft(){
  _quoteDraft=_quoteDraft.map((q,i)=>({
    id:q.id||uid(),
    contractor:(document.getElementById(`qdc${i}`)?.value||q.contractor||'').trim(),
    amount:document.getElementById(`qda${i}`)?.value??q.amount??'',
    notes:(document.getElementById(`qdn${i}`)?.value||q.notes||'').trim()
  }));
}
function renderQuoteDraftRows(){
  const host=document.getElementById('quoteDraftRows'); if(!host)return;
  const names=contractorNames();
  host.innerHTML=_quoteDraft.length?_quoteDraft.map((q,i)=>`<div class="quoteDraftRow">
    <div class="field"><label>Contractor</label><input id="qdc${i}" list="quoteContractors${i}" value="${esc(q.contractor||'')}" placeholder="Choose or type a contractor">${dataListHtml(`quoteContractors${i}`,names)}</div>
    <div class="field"><label>Quote amount</label><input id="qda${i}" type="number" min="0" step="0.01" value="${q.amount??''}" placeholder="0.00"></div>
    <div class="field"><label>Notes / exclusions</label><input id="qdn${i}" value="${esc(q.notes||'')}" placeholder="e.g. Includes demolition; excludes appliances"></div>
    <button class="iconbtn" title="Remove quote" onclick="removeQuoteDraft(${i})">×</button>
  </div>`).join(''):`<div class="empty">No contractor quotes added yet. You can save the request now and add quotes as they arrive.</div>`;
}
function addQuoteDraft(){captureQuoteDraft();_quoteDraft.push({id:uid(),contractor:'',amount:'',notes:''});renderQuoteDraftRows();setTimeout(()=>document.getElementById(`qdc${_quoteDraft.length-1}`)?.focus(),0)}
function removeQuoteDraft(i){captureQuoteDraft();_quoteDraft.splice(i,1);renderQuoteDraftRows()}
openQuoteRequest=function(id){
  const qr=id?state.quoteRequests.find(x=>x.id===id):{id:uid(),roomId:state.rooms[0]?.id||'',scope:'',allowance:0,status:'Comparing',selectedQuoteId:null,quotes:[]};
  _quoteDraft=(qr.quotes||[]).map(q=>({...q}));
  openModal(`<h2>${id?'Edit':'New'} quote request</h2>
    <div class="callout sage"><strong>What goes in “Scope”?</strong><div class="muted">Describe the exact package of work you want priced so every quote is comparable. Examples: “Kitchen cabinetry supply & installation”, “Electrical rough-in and fit-off”, or “Bathroom tiling labour”.</div></div>
    <div class="formgrid section"><div class="field"><label>Room / project</label><select id="qRoom">${roomOptions(qr.roomId)}</select></div><div class="field"><label>Scope of work</label><input id="qScope" value="${esc(qr.scope)}" placeholder="e.g. Kitchen cabinetry supply & installation"><div class="helptext">This becomes the quote package name throughout RenoMate.</div></div>${field('Original allowance','qAllow',qr.allowance,'number')}</div>
    <div class="panelhead section"><div><div class="eyebrow">Contractor quotes</div><h3>Add quotes now or later</h3></div><button class="btn small" onclick="addQuoteDraft()">+ Add Contractor Quote</button></div>
    <div id="quoteDraftRows" class="quoteDraftRows"></div>
    <div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveQuoteRequest('${qr.id}')">Save Quote Request</button></div>`);
  renderQuoteDraftRows();
};
saveQuoteRequest=function(id){
  const scope=requireText('#qScope','Scope of work');if(scope===null)return;
  const allowance=nonNegative('#qAllow','Original allowance');if(allowance===null)return;
  captureQuoteDraft();
  const quotes=[];
  for(const q of _quoteDraft){
    if(!q.contractor && (q.amount===''||q.amount===null) && !q.notes)continue;
    if(!q.contractor){alert('Choose or enter a contractor for each quote.');return}
    const amount=finiteNum(q.amount);if(amount===null||amount<0){alert(`Enter a valid quote amount for ${q.contractor}.`);return}
    quotes.push({id:q.id||uid(),contractor:q.contractor,amount,notes:q.notes||''});
  }
  const old=state.quoteRequests.find(x=>x.id===id), oldSel=old?quoteSelected(old):null;
  let selectedQuoteId=null;
  if(oldSel){const kept=quotes.find(q=>q.id===oldSel.id)||quotes.find(q=>q.contractor.toLowerCase()===oldSel.contractor.toLowerCase());selectedQuoteId=kept?.id||null}
  const obj={id,roomId:$('#qRoom').value,scope,allowance,status:selectedQuoteId?'Selected':'Comparing',selectedQuoteId,quotes};
  if(old)Object.assign(old,obj);else state.quoteRequests.push(obj);
  save();closeModal();render();
  toast(quotes.length?`Quote request saved with ${quotes.length} quote${quotes.length===1?'':'s'}`:'Quote request saved — add contractor quotes when they arrive');
};

// ---- Contractor dropdowns reused across operational forms ------------------
openPayment=function(id){const p=id?state.payments.find(x=>x.id===id):{id:uid(),roomId:state.rooms[0]?.id||'',payee:'',label:'',amount:0,due:new Date().toISOString().slice(0,10),status:'Due'};openModal(`<h2>${id?'Edit':'Add'} payment</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="pRoom">${roomOptions(p.roomId)}</select></div>${partyInput('Payee / contractor','pPayee',p.payee,true)}${field('Milestone / reason','pLabel',p.label)}${field('Amount','pAmount',p.amount,'number')}${field('Due date','pDue',p.due,'date')}<div class="field"><label>Status</label><select id="pStatus"><option ${p.status==='Due'?'selected':''}>Due</option><option ${p.status==='Paid'?'selected':''}>Paid</option></select></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePayment('${p.id}')">Save Payment</button></div>`)};
openDefect=function(){const d={id:uid(),roomId:state.rooms[0]?.id||'',title:'',owner:'',status:'Open',raised:new Date().toISOString().slice(0,10)};openModal(`<h2>Add defect</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="dfRoom">${roomOptions(d.roomId)}</select></div>${field('Defect','dfTitle','')}${partyInput('Owner / contractor','dfOwner','',true)}${field('Raised','dfRaised',d.raised,'date')}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDefect('${d.id}')">Add Defect</button></div>`)};
openDelivery=function(id){const d=id?state.deliveries.find(x=>x.id===id):{id:uid(),roomId:state.rooms[0]?.id||'',item:'',supplier:'',due:'',status:'Ordered'};openModal(`<h2>${id?'Edit':'Add'} delivery</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="dRoom">${roomOptions(d.roomId)}</select></div>${field('Item','dItem',d.item)}${partyInput('Supplier / contractor','dSupplier',d.supplier,false)}${field('Expected date','dDue',d.due,'date')}<div class="field"><label>Status</label><select id="dStatus"><option ${d.status==='Not ordered'?'selected':''}>Not ordered</option><option ${d.status==='Ordered'?'selected':''}>Ordered</option><option ${d.status==='Received'?'selected':''}>Received</option></select></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDelivery('${d.id}')">Save Delivery</button></div>`)};
openSelection=function(id){const s=id?state.selections.find(x=>x.id===id):{id:uid(),roomId:state.rooms[0]?.id||'',item:'',supplier:'',allowance:0,price:0,status:'Shortlisted',due:''};openModal(`<h2>${id?'Edit':'Add'} selection</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="sRoom">${roomOptions(s.roomId)}</select></div>${field('Item / selection','sItem',s.item)}${partyInput('Supplier / contractor','sSupplier',s.supplier,false)}${field('Allowance','sAllow',s.allowance,'number')}${field('Actual / selected price','sPrice',s.price,'number')}<div class="field"><label>Status</label><select id="sStatus">${['Shortlisted','Selected','Ordered','Received','Installed'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div>${field('Expected delivery','sDue',s.due,'date')}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSelection('${s.id}')">Save Selection</button></div>`)};

// ---- Live timeline ----------------------------------------------------------
function timelineEvents(){
  const ev=[];
  (state.milestones||[]).forEach(m=>ev.push({id:`m:${m.id}`,date:m.date,title:m.title,type:'Milestone',status:m.status,source:'manual'}));
  (state.payments||[]).filter(p=>p.due).forEach(p=>ev.push({id:`p:${p.id}`,date:p.due,title:`Payment: ${p.payee} — ${p.label}`,type:'Payment',status:p.status==='Paid'?'Done':daysUntil(p.due)<0?'Overdue':'Upcoming',source:'auto'}));
  (state.selections||[]).filter(s=>s.due&&['Ordered','Received','Installed'].includes(s.status)).forEach(s=>ev.push({id:`s:${s.id}`,date:s.due,title:`Selection delivery: ${s.item}`,type:'Selection',status:s.status==='Received'||s.status==='Installed'?'Done':'Upcoming',source:'auto'}));
  (state.deliveries||[]).filter(d=>d.due).forEach(d=>ev.push({id:`d:${d.id}`,date:d.due,title:`Delivery: ${d.item}`,type:'Delivery',status:d.status==='Received'?'Done':daysUntil(d.due)<0?'Overdue':'Upcoming',source:'auto'}));
  (state.tasks||[]).filter(t=>t.due).forEach(t=>ev.push({id:`t:${t.id}`,date:t.due,title:`Task: ${t.title}`,type:'Task',status:t.status==='Done'?'Done':daysUntil(t.due)<0?'Overdue':'Upcoming',source:'auto'}));
  (state.variations||[]).filter(v=>v.date).forEach(v=>ev.push({id:`v:${v.id}`,date:v.date,title:`Variation: ${v.title}`,type:'Variation',status:v.status,source:'auto'}));
  if(state.settings.startDate)ev.push({id:'project:start',date:state.settings.startDate,title:'Project start',type:'Project',status:'Done',source:'auto'});
  if(state.settings.targetDate)ev.push({id:'project:target',date:state.settings.targetDate,title:'Target completion',type:'Project',status:'Upcoming',source:'auto'});
  const seen=new Set();
  return ev.filter(e=>e.date&&e.title&&!seen.has(`${e.date}|${e.title}`)&&seen.add(`${e.date}|${e.title}`)).sort((a,b)=>a.date.localeCompare(b.date));
}
function openMilestone(id){const m=id?state.milestones.find(x=>x.id===id):{id:uid(),date:new Date().toISOString().slice(0,10),title:'',status:'Upcoming'};openModal(`<h2>${id?'Edit':'Add'} milestone</h2><div class="formgrid">${field('Milestone','mTitle',m.title)}${field('Date','mDate',m.date,'date')}<div class="field"><label>Status</label><select id="mStatus">${['Upcoming','Current','Done'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveMilestone('${m.id}')">Save Milestone</button></div>`)}
function saveMilestone(id){const title=requireText('#mTitle','Milestone');if(title===null)return;const m=state.milestones.find(x=>x.id===id),obj={id,title,date:$('#mDate').value,status:$('#mStatus').value};if(m)Object.assign(m,obj);else state.milestones.push(obj);save();closeModal();render();toast('Milestone saved')}
function deleteMilestone(id){const m=state.milestones.find(x=>x.id===id);if(!m)return;if(!confirm(`Delete milestone “${m.title}”?`))return;state.milestones=state.milestones.filter(x=>x.id!==id);save();render();toast('Milestone deleted')}
renderTimeline=function(){
  const events=timelineEvents(), approvedDays=state.variations.filter(x=>x.status==='Approved').reduce((a,b)=>a+(Number(b.days)||0),0);
  pageTitle('Timeline','Builds itself from project activity — with manual milestones when you need them',`<button class="btn primary" onclick="openMilestone()">＋ Add Milestone</button>`);
  $('#view').innerHTML=`<div class="callout sage"><strong>How this timeline is populated</strong><div class="muted">RenoMate automatically pulls in payment due dates, deliveries, selection deliveries, tasks, variations, project start and target completion. Add manual milestones for construction stages such as demolition, rough-in, waterproofing or practical completion.</div></div><div class="grid cols2 section"><div class="card"><div class="eyebrow">Live project sequence</div><h2>${events.length} dated project events</h2><div class="timeline section">${events.map(e=>`<div class="mile ${e.status==='Done'?'done':e.status==='Current'||e.status==='Overdue'?'warn':''}"><div class="mileDot"></div><div class="mileDate">${dateFmt(e.date)}</div><div><div class="timelineType">${esc(e.type)}${e.source==='auto'?' • automatic':''}</div><strong>${esc(e.title)}</strong><br><span>${esc(e.status)}</span></div><div>${statusBadge(e.status)}${e.source==='manual'?`<div style="margin-top:5px"><button class="btn small" onclick="openMilestone('${e.id.slice(2)}')">Edit</button> <button class="btn small" onclick="deleteMilestone('${e.id.slice(2)}')">Delete</button></div>`:''}</div></div>`).join('')||'<div class="empty">No dated project activity yet.</div>'}</div></div><div class="card"><div class="eyebrow">Schedule impact</div><h2>Approved variation days</h2><div class="big">${approvedDays>0?'+':''}${approvedDays} days</div><p class="muted">Approved variation day impacts are shown separately so schedule pressure remains visible.</p><div class="callout sage"><strong>Target completion</strong><div class="big" style="font-size:26px;margin-top:5px">${dateFmt(state.settings.targetDate)}</div><div class="muted">${state.settings.targetDate?`${daysUntil(state.settings.targetDate)} days from today`:'No target date set'}</div></div></div></div>`;
};
pages.timeline=renderTimeline;

// ---- Explicit two-step restore ---------------------------------------------
let _pendingRestore=null;
function prepareRestore(file){
  _pendingRestore=null;
  const host=document.getElementById('restorePreview');if(host)host.innerHTML='';
  const btn=document.getElementById('restoreConfirmBtn');if(btn)btn.disabled=true;
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const x=JSON.parse(r.result);
    if(x.app!==APP||!validStateData(x.data))throw new Error('This is not a valid RenoMate backup.');
    _pendingRestore=x;
    const p=document.getElementById('restorePreview');if(p)p.innerHTML=`<div class="restorePreview"><strong>Backup ready to restore</strong><div class="metricline"><span>Project</span><strong>${esc(x.data.settings?.projectName||'Unnamed project')}</strong></div><div class="metricline"><span>Backup created</span><strong>${x.exportedAt?dateFmt(x.exportedAt.slice(0,10)):'Unknown'}</strong></div><div class="metricline"><span>Rooms / workstreams</span><strong>${x.data.rooms?.length||0}</strong></div><div class="metricline"><span>Quote packages</span><strong>${x.data.quoteRequests?.length||0}</strong></div><div class="helptext">Nothing has been restored yet. Click <b>Restore This Backup</b> below to continue.</div></div>`;
    const b=document.getElementById('restoreConfirmBtn');if(b)b.disabled=false;
  }catch(e){alert(e.message);const input=document.getElementById('restoreFile');if(input)input.value=''}};
  r.readAsText(file);
}
function confirmPreparedRestore(){
  if(!_pendingRestore){alert('Choose a valid RenoMate backup file first.');return}
  const project=_pendingRestore.data.settings?.projectName||'this backup';
  if(!confirm(`Restore “${project}”?\n\nYour current project will be replaced. RenoMate will download a safety backup first.`))return;
  safetyBackup();state=normaliseState(_pendingRestore.data);state.schema=2;if(!state.settings.dateFormat)state.settings.dateFormat='DMY';save();_pendingRestore=null;render();toast('Backup restored successfully');
}
restoreFile=prepareRestore;
renderBackup=function(){
  pageTitle('Backup & Restore','Your renovation data is valuable — keep a copy outside the browser');
  $('#view').innerHTML=`<div class="grid cols2"><div class="card"><div class="eyebrow">Full backup</div><h2>Download everything</h2><p class="muted">Creates a validated JSON backup containing your entire renovation project.</p><button class="btn primary" onclick="backupNow()">Download Backup</button></div><div class="card"><div class="eyebrow">Safe restore</div><h2>Restore a previous backup</h2><p class="muted">Step 1: choose a RenoMate backup. Step 2: review the details. Step 3: explicitly confirm the restore.</p><input type="file" id="restoreFile" accept="application/json" onchange="prepareRestore(this.files[0])"><div id="restorePreview"></div><div class="actions section"><button id="restoreConfirmBtn" class="btn terr" disabled onclick="confirmPreparedRestore()">Restore This Backup</button></div></div></div><div class="callout section"><strong>Your current project is protected.</strong><div class="muted">Before a confirmed restore, RenoMate automatically downloads a safety backup of the project currently in your browser.</div></div>`;
};
pages.backup=renderBackup;

// ---- Fresh setup + Settings + full reset -----------------------------------
const _freshStateRC2=freshState;
freshState=function(opts){const s=_freshStateRC2(opts);s.settings.dateFormat=opts.dateFormat||(opts.currency==='USD'?'MDY':'DMY');return s};
openFreshProjectSetup=function(fromExisting=false){
  openModal(`<h2>${fromExisting?'Start a new project':'Welcome to RenoMate'}</h2><p class="muted">${fromExisting?'This replaces the current project after downloading a safety backup.':'Explore the demo, or create your renovation with a clean project.'}</p><div class="onboard-grid section"><div class="field"><label>Project name</label><input id="freshName" value="My Renovation"></div><div class="field"><label>Location</label><input id="freshLocation" placeholder="Optional"></div><div class="field"><label>Currency</label><select id="freshCurrency"><option>AUD</option><option>USD</option><option>GBP</option><option>EUR</option></select></div><div class="field"><label>Date format</label><select id="freshDateFormat"><option value="DMY">DD/MM/YYYY — UK / Australia</option><option value="MDY">MM/DD/YYYY — US</option><option value="LONG">28 Sep 2026 — Unambiguous</option><option value="ISO">YYYY-MM-DD — ISO</option></select></div><div class="field"><label>Approved base budget</label><input id="freshBase" type="number" min="0" value="100000"></div><div class="field"><label>Contingency allowance</label><input id="freshCont" type="number" min="0" value="10000"></div><div class="field"><label>Target completion</label><input id="freshTarget" type="date"></div></div><div class="callout sage section"><strong>Start simple.</strong><div class="muted">RenoMate creates one Whole Project allowance. Add rooms or workstreams when you are ready; the live forecast will always reconcile to those room allowances.</div></div><div class="modalfoot">${!fromExisting?'<button class="btn" onclick="closeModal();save()">Explore Demo</button>':'<button class="btn" onclick="closeModal()">Cancel</button>'}<button class="btn terr" onclick="startFreshProject(${fromExisting?'true':'false'})">Start Fresh Project</button></div>`);
  const cur=document.getElementById('freshCurrency'), fmt=document.getElementById('freshDateFormat');
  if(cur&&fmt)cur.addEventListener('change',()=>{if(cur.value==='USD')fmt.value='MDY';else if(['AUD','GBP','EUR'].includes(cur.value))fmt.value='DMY'});
};
startFreshProject=function(fromExisting=false){

function clearAllRenoMateData(){

  safetyBackup('RenoMate_Pre_Reset_Backup');
