}
renderSettings=function(){
  pageTitle('Settings','Project identity, regional formats, approved budget ceiling and target date');
  $('#view').innerHTML=`<div class="card"><div class="formgrid"><div class="field"><label>Project name</label><input id="setName" value="${esc(state.settings.projectName)}"></div><div class="field"><label>Location</label><input id="setLocation" value="${esc(state.settings.location)}"></div><div class="field"><label>Currency</label><select id="setCurrency"><option ${state.settings.currency==='AUD'?'selected':''}>AUD</option><option ${state.settings.currency==='USD'?'selected':''}>USD</option><option ${state.settings.currency==='GBP'?'selected':''}>GBP</option><option ${state.settings.currency==='EUR'?'selected':''}>EUR</option></select></div><div class="field"><label>Date format</label><select id="setDateFormat"><option value="DMY" ${state.settings.dateFormat==='DMY'?'selected':''}>DD/MM/YYYY — UK / Australia</option><option value="MDY" ${state.settings.dateFormat==='MDY'?'selected':''}>MM/DD/YYYY — US</option><option value="LONG" ${state.settings.dateFormat==='LONG'?'selected':''}>28 Sep 2026 — Unambiguous</option><option value="ISO" ${state.settings.dateFormat==='ISO'?'selected':''}>YYYY-MM-DD — ISO</option></select><div class="helptext">This controls dates shown throughout RenoMate. Browser date pickers may still follow your device locale.</div></div><div class="field"><label>Approved base budget</label><input id="setBase" type="number" min="0" value="${state.settings.baseBudget}"></div><div class="field"><label>Contingency allowance</label><input id="setCont" type="number" min="0" value="${state.settings.contingency}"></div><div class="field"><label>Target completion date</label><input id="setTarget" type="date" value="${state.settings.targetDate||''}"></div></div><div class="callout sage section"><strong>Approved ceiling = approved base budget + contingency.</strong><div class="muted">The live forecast starts from the sum of room allowances. Budget & Forecast shows any amount that is still unallocated or already exceeds the approved base.</div></div><div class="actions section"><button class="btn primary" onclick="saveSettings()">Save Settings</button><button class="btn" onclick="openFreshProjectSetup(true)">Start New Project</button><button class="btn" onclick="resetDemo()">Load Demo Data</button></div></div><div class="card section dangerZone"><div class="eyebrow">Danger zone</div><h2>Reset RenoMate and clear this browser's project data</h2><p class="muted">Use this when you want to completely start over. RenoMate will download a safety backup first, then clear the current project and reopen first-run setup.</p><button class="btn danger" onclick="clearAllRenoMateData()">Clear All Data & Reset App</button></div>`;
};
pages.settings=renderSettings;
saveSettings=function(){
  const base=nonNegative('#setBase','Approved base budget');if(base===null)return;const cont=nonNegative('#setCont','Contingency allowance');if(cont===null)return;
  state.settings.projectName=$('#setName').value.trim()||'My Renovation';state.settings.location=$('#setLocation').value.trim();state.settings.currency=$('#setCurrency').value;state.settings.dateFormat=$('#setDateFormat').value;state.settings.baseBudget=base;state.settings.contingency=cont;state.settings.targetDate=$('#setTarget').value;save();render();toast(`Settings saved • ${dateFormatLabel(state.settings.dateFormat)}`);
};

// Preserve the user's regional date preference when loading demo data.
resetDemo=function(){
  if(!confirm('Load the original RenoMate demo project?\n\nA safety backup of your current project will download first.'))return;
  const fmt=state.settings.dateFormat||'DMY';
  safetyBackup();state=seed();state.schema=2;state.settings.dateFormat=fmt;save();render();toast('Demo project loaded');
};

// Update nav-side project meta after a regional setting change.
render();
</script>

<script>
/* RenoMate GTM hardening — v0.6.0 RC3 */

// ---------- Budget allocation model -----------------------------------------
function isUnallocatedRoom(id){return id==='unallocated'}
function realRooms(){return (state.rooms||[]).filter(r=>!isUnallocatedRoom(r.id))}
function allocatedRoomTotal(){return realRooms().reduce((n,r)=>n+(Number(r.budget)||0),0)}
function unallocatedRoom(){return (state.rooms||[]).find(r=>isUnallocatedRoom(r.id))}
function ensureUnallocatedBudget(){
  state.rooms=Array.isArray(state.rooms)?state.rooms:[];
  const base=Number(state.settings?.baseBudget)||0;
  const allocated=allocatedRoomTotal();
  let u=unallocatedRoom();
  if(!u){u={id:'unallocated',name:'Unallocated Budget',budget:0,progress:0,system:true};state.rooms.push(u)}
  u.name='Unallocated Budget';u.progress=0;u.system=true;u.budget=Math.max(0,base-allocated);
  return base-allocated;
}
function plannedRoomTotal(){return (state.rooms||[]).reduce((n,r)=>n+(Number(r.budget)||0),0)}
function roomOptions(sel){
  const rows=realRooms();
  if(!rows.length)return '<option value="">Add a room/workstream first</option>';
  return rows.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.name)}</option>`).join('')
}
function defaultRoomId(){return realRooms()[0]?.id||''}
function roomName(id){return room(id)?.name||(isUnallocatedRoom(id)?'Unallocated Budget':'Whole Project')}

const _freshStateRC3=freshState;
freshState=function(opts){
  const s=_freshStateRC3(opts);
  const base=Number(opts.base)||0;
  s.rooms=[
    {id:'whole',name:'Whole Project',budget:0,progress:0},
    {id:'unallocated',name:'Unallocated Budget',budget:base,progress:0,system:true}
  ];
  s.schema=3;
  return s
};

const _normaliseStateRC3=normaliseState;
normaliseState=function(d){
  d=_normaliseStateRC3(d)||d;
  if(!d)return d;
  d.schema=3;
  d.rooms=Array.isArray(d.rooms)?d.rooms:[];
  if(!d.rooms.length)d.rooms=[{id:'whole',name:'Whole Project',budget:0,progress:0}];
  // Legacy quote links: resolve contractorId from stored name when possible.
  (d.quoteRequests||[]).forEach(qr=>(qr.quotes||[]).forEach(q=>{
    if(!q.contractorId&&q.contractor){const c=(d.contractors||[]).find(x=>x.name===q.contractor);if(c)q.contractorId=c.id}
    if(q.contractorId){const c=(d.contractors||[]).find(x=>x.id===q.contractorId);if(c)q.contractor=c.name}
  }));
  state=d;
  ensureUnallocatedBudget();
  return d
};
state=normaliseState(state);save();

function saveRoom(id){
  if(isUnallocatedRoom(id)){alert('Unallocated Budget is managed automatically from the Approved Base Budget.');return}
  const name=requireText('#rName','Room / workstream name'); if(name===null)return;
  const budget=nonNegative('#rBudget','Original allowance'); if(budget===null)return;
  const progress=finiteNum($('#rProgress').value);
  if(progress===null||progress<0||progress>100){alert('Progress must be between 0 and 100.');$('#rProgress').focus();return}
  const other=realRooms().filter(r=>r.id!==id).reduce((n,r)=>n+(Number(r.budget)||0),0);
  const base=Number(state.settings.baseBudget)||0;
  if(other+budget>base){alert(`This would allocate ${money(other+budget)} across rooms, which exceeds the approved base budget of ${money(base)}.\n\nReduce this room allowance or increase the Approved Base Budget in Settings.`);return}
  const r=state.rooms.find(x=>x.id===id),obj={id,name,budget,progress};
  if(r)Object.assign(r,obj);else state.rooms.push(obj);
  ensureUnallocatedBudget();save();closeModal();render();toast(`Room saved • ${money(unallocatedRoom()?.budget||0)} unallocated`)
}
function deleteRoom(id){
  if(id==='whole'){alert('Whole Project is the default workstream and cannot be deleted. You can rename it or leave its allowance at zero.');return}
  if(isUnallocatedRoom(id))return;
  const r=room(id);if(!r)return;
  const refs=[];
  const groups=[['commitments','commitment'],['quoteRequests','quote package'],['selections','selection'],['variations','variation'],['payments','payment'],['tasks','task'],['decisions','decision'],['deliveries','delivery'],['defects','defect']];
  groups.forEach(([k,label])=>{const n=(state[k]||[]).filter(x=>x.roomId===id).length;if(n)refs.push(`${n} ${label}${n===1?'':'s'}`)});
  if(refs.length){alert(`“${r.name}” cannot be deleted yet because it is linked to ${refs.join(', ')}.\n\nReassign or delete those records first.`);return}
  if(!confirm(`Delete room/workstream “${r.name}”?\n\nIts ${money(r.budget)} allowance will return to Unallocated Budget.`))return;
  state.rooms=state.rooms.filter(x=>x.id!==id);ensureUnallocatedBudget();save();render();toast('Room deleted • allowance returned to Unallocated Budget')
}
function renderRooms(){
  ensureUnallocatedBudget();
  const allocated=allocatedRoomTotal(),base=Number(state.settings.baseBudget)||0,free=Number(unallocatedRoom()?.budget)||0;
  pageTitle('Rooms & Projects','Allocate the approved base budget across rooms without ever double-counting it',`<button class="btn primary" onclick="openRoom()">＋ Add Room</button>`);
  const cards=realRooms().map(r=>{const f=roomForecast(r.id),v=f-r.budget,sel=state.selections.filter(x=>x.roomId===r.id&&x.status==='Shortlisted').length,task=state.tasks.filter(x=>x.roomId===r.id&&x.status!=='Done').length;return`<div class="card roomcard"><div class="roomtop"><div><div class="roomname">${esc(r.name)}</div><div class="tiny">${r.progress}% work progress</div></div>${badge(v>0?`${money(v)} over`:`${money(Math.abs(v))} under`,v>0?'red':'green')}</div><div class="progress ${v>0?'over':''}"><span style="width:${Math.min(100,r.progress)}%"></span></div><div class="roomstats"><div class="mini"><span>Budget</span><strong>${money(r.budget)}</strong></div><div class="mini"><span>Forecast</span><strong>${money(f)}</strong></div><div class="mini"><span>Variance</span><strong class="money ${v>0?'bad':'good'}">${v>0?'+':''}${money(v)}</strong></div></div><div class="metricline"><span>Selections undecided</span><strong>${sel}</strong></div><div class="metricline"><span>Open tasks</span><strong>${task}</strong></div><div class="actions"><button class="btn small" onclick="openRoom('${r.id}')">Edit</button><button class="btn small" onclick="deleteRoom('${r.id}')">Delete</button><button class="btn small soft" onclick="navTo('budget')">Budget detail</button></div></div>`}).join('');
  $('#view').innerHTML=`<div class="decisionHero"><div><div class="decisionEyebrow">Approved Base → Unallocated → Rooms</div><h2>Allocate the budget <em>once.</em></h2><p>Adding a room now moves money out of Unallocated Budget instead of adding a second copy of the same budget. The invariant stays simple: Rooms + Unallocated = Approved Base.</p></div><div class="decisionStats"><div class="decisionStat"><span>Approved base</span><strong>${money(base)}</strong></div><div class="decisionStat"><span>Allocated to rooms</span><strong>${money(allocated)}</strong></div><div class="decisionStat"><span>Unallocated</span><strong class="${free?'warn':'good'}">${money(free)}</strong></div><div class="decisionStat"><span>Reconciled</span><strong class="good">${money(allocated+free)}</strong></div></div></div><div class="grid cols3 section">${cards}</div>`
}
pages.rooms=renderRooms;

// Settings keeps the allocation invariant.
const _renderSettingsRC3=renderSettings;
renderSettings=function(){_renderSettingsRC3();const call=$('#view .callout.sage');if(call)call.innerHTML='<strong>Approved Base → Unallocated → Rooms.</strong><div class="muted">When you add or edit a room allowance, RenoMate automatically adjusts Unallocated Budget. Room allocations cannot exceed the Approved Base Budget.</div>'};
pages.settings=renderSettings;
saveSettings=function(){
  const base=nonNegative('#setBase','Approved base budget');if(base===null)return;const cont=nonNegative('#setCont','Contingency allowance');if(cont===null)return;
  const allocated=allocatedRoomTotal();if(base<allocated){alert(`Approved Base Budget cannot be reduced below the ${money(allocated)} already allocated to rooms/workstreams.`);return}
  state.settings.projectName=$('#setName').value.trim()||'My Renovation';state.settings.location=$('#setLocation').value.trim();state.settings.currency=$('#setCurrency').value;state.settings.dateFormat=$('#setDateFormat').value;state.settings.baseBudget=base;state.settings.contingency=cont;state.settings.targetDate=$('#setTarget').value;ensureUnallocatedBudget();save();render();toast(`Settings saved • ${money(unallocatedRoom()?.budget||0)} unallocated`)
};

// ---------- Contractor-linked quotes ----------------------------------------
function quoteContractorName(q){return contractor(q.contractorId)?.name||q.contractor||'Unknown contractor'}
function captureQuoteDraft(){
  _quoteDraft=_quoteDraft.map((q,i)=>({
    id:q.id||uid(),contractorId:document.getElementById(`qdc${i}`)?.value||q.contractorId||'',
    contractor:q.contractor||'',amount:document.getElementById(`qda${i}`)?.value??q.amount??'',notes:(document.getElementById(`qdn${i}`)?.value||q.notes||'').trim()
  }))
}
function renderQuoteDraftRows(){
  const host=document.getElementById('quoteDraftRows');if(!host)return;
  host.innerHTML=_quoteDraft.length?_quoteDraft.map((q,i)=>`<div class="quoteDraftRow"><div class="field"><label>Contractor</label><select id="qdc${i}"><option value="">Choose contractor</option>${(state.contractors||[]).map(c=>`<option value="${c.id}" ${q.contractorId===c.id?'selected':''}>${esc(c.name)}${c.trade?` — ${esc(c.trade)}`:''}</option>`).join('')}</select><div class="helptext">Add contractors in the Contractors section first, then reuse them here.</div></div><div class="field"><label>Quote amount</label><input id="qda${i}" type="number" min="0" step="0.01" value="${q.amount??''}" placeholder="0.00"></div><div class="field"><label>Notes / exclusions</label><input id="qdn${i}" value="${esc(q.notes||'')}" placeholder="e.g. Includes demolition; excludes appliances"></div><button class="iconbtn" title="Remove quote" aria-label="Remove contractor quote" onclick="removeQuoteDraft(${i})">×</button></div>`).join(''):`<div class="empty">No contractor quotes added yet. Save the request now and add quotes as they arrive.</div>`
}
function addQuoteDraft(){captureQuoteDraft();_quoteDraft.push({id:uid(),contractorId:'',contractor:'',amount:'',notes:''});renderQuoteDraftRows()}
saveQuoteRequest=function(id){
  const scope=requireText('#qScope','Scope of work');if(scope===null)return;const allowance=nonNegative('#qAllow','Original allowance');if(allowance===null)return;captureQuoteDraft();
  const quotes=[];for(const q of _quoteDraft){if(!q.contractorId && (q.amount===''||q.amount===null)&&!q.notes)continue;if(!q.contractorId){alert('Choose a contractor for each quote.');return}const c=contractor(q.contractorId);if(!c){alert('One selected contractor no longer exists. Refresh the quote package and choose a valid contractor.');return}const amount=finiteNum(q.amount);if(amount===null||amount<0){alert(`Enter a valid quote amount for ${c.name}.`);return}quotes.push({id:q.id||uid(),contractorId:c.id,contractor:c.name,amount,notes:q.notes||''})}
  const old=state.quoteRequests.find(x=>x.id===id),oldSel=old?quoteSelected(old):null;let selectedQuoteId=null;if(oldSel){const kept=quotes.find(q=>q.id===oldSel.id)||quotes.find(q=>q.contractorId===oldSel.contractorId);selectedQuoteId=kept?.id||null}
  const obj={id,roomId:$('#qRoom').value,scope,allowance,status:selectedQuoteId?'Selected':'Comparing',selectedQuoteId,quotes};if(old)Object.assign(old,obj);else state.quoteRequests.push(obj);save();closeModal();render();toast(quotes.length?`Quote request saved with ${quotes.length} quote${quotes.length===1?'':'s'}`:'Quote request saved — add contractor quotes when they arrive')
};
const _renderQuotesRC3=renderQuotes;
renderQuotes=function(){_renderQuotesRC3();document.querySelectorAll('.quoteOption .vendor').forEach(()=>{});$('#view').innerHTML=$('#view').innerHTML.replace(/<div class="vendor">([^<]*)/g,(m)=>m)};
// Renderers below use quoteContractorName directly where contractor totals matter.
function renderContractors(){
  pageTitle('Contractors','Who is doing what, and how much work is committed to them?',`<button class="btn primary" onclick="openContractor()">＋ Add Contractor</button>`);
  const cards=state.contractors.map(c=>{let committed=state.commitments.filter(x=>x.contractorId===c.id&&x.status==='Committed').reduce((a,b)=>a+(Number(b.amount)||0),0);state.quoteRequests.filter(x=>x.selectedQuoteId).forEach(qr=>{const q=quoteSelected(qr);if(q?.contractorId===c.id)committed+=Number(q.amount)||0});const paid=state.payments.filter(x=>x.payee===c.name&&x.status==='Paid').reduce((a,b)=>a+(Number(b.amount)||0),0);return`<div class="card"><div class="roomtop"><div><div class="roomname" style="font-size:18px">${esc(c.name)}</div><div class="muted">${esc(c.trade)}</div></div>${badge(c.rating,'green')}</div><div class="metricline"><span>Committed work</span><strong>${money(committed)}</strong></div><div class="metricline"><span>Paid so far</span><strong>${money(paid)}</strong></div><div class="tiny section">${esc(c.phone)}<br>${esc(c.email)}</div><div class="actions section"><button class="btn small" onclick="openContractor('${c.id}')">Edit</button><button class="btn small" onclick="deleteContractor('${c.id}')">Delete</button></div></div>`}).join('');
  $('#view').innerHTML=cards?`<div class="grid cols3">${cards}</div>`:'<div class="empty"><h2>No contractors yet</h2><p>Add your builder, trades and suppliers once, then reuse them in quotes and other records.</p><button class="btn primary" onclick="openContractor()">+ Add Contractor</button></div>'
}
pages.contractors=renderContractors;
function saveContractor(id){
  const name=requireText('#ctName','Business / contractor name');if(name===null)return;const email=$('#ctEmail').value.trim();if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('Enter a valid email address, or leave the email field blank.');$('#ctEmail').focus();return}
  const c=contractor(id),obj={id,name,trade:$('#ctTrade').value.trim(),phone:$('#ctPhone').value.trim(),email,rating:$('#ctRating').value};
  if(c){Object.assign(c,obj);(state.quoteRequests||[]).forEach(qr=>(qr.quotes||[]).forEach(q=>{if(q.contractorId===id)q.contractor=name}))}else state.contractors.push(obj);save();closeModal();render();toast('Contractor saved')
}
function deleteContractor(id){
  const c=contractor(id);if(!c)return;const refs=[];const nCom=state.commitments.filter(x=>x.contractorId===id).length;if(nCom)refs.push(`${nCom} commitment${nCom===1?'':'s'}`);let nq=0;state.quoteRequests.forEach(qr=>nq+=(qr.quotes||[]).filter(q=>q.contractorId===id).length);if(nq)refs.push(`${nq} quote${nq===1?'':'s'}`);if(refs.length){alert(`“${c.name}” cannot be deleted because it is linked to ${refs.join(' and ')}. Reassign or remove those records first.`);return}if(!confirm(`Delete contractor “${c.name}”?`))return;state.contractors=state.contractors.filter(x=>x.id!==id);save();render();toast('Contractor deleted')
}

// ---------- Consistent lifecycle management ---------------------------------
function deletePayment(id){const p=state.payments.find(x=>x.id===id);if(!p)return;if(!confirm(`Delete payment “${p.label}” for ${money(p.amount)}?`))return;state.payments=state.payments.filter(x=>x.id!==id);save();render();toast('Payment deleted')}
function deleteDelivery(id){const d=state.deliveries.find(x=>x.id===id);if(!d)return;if(!confirm(`Delete delivery “${d.item}”?`))return;state.deliveries=state.deliveries.filter(x=>x.id!==id);save();render();toast('Delivery deleted')}
function openTask(id){const t=id?state.tasks.find(x=>x.id===id):{id:uid(),roomId:defaultRoomId(),title:'',due:'',status:'Open',priority:'Medium'};openModal(`<h2>${id?'Edit':'Add'} task</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="tRoom">${roomOptions(t.roomId)}</select></div>${field('Task','tTitle',t.title,'text','maxlength="180"')}${field('Due date — optional','tDue',t.due,'date')}<div class="field"><label>Priority</label><select id="tPriority">${['High','Medium','Low'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="tStatus"><option ${t.status==='Open'?'selected':''}>Open</option><option ${t.status==='Done'?'selected':''}>Done</option></select></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTask('${t.id}')">Save Task</button></div>`)}
function saveTask(id){const title=requireText('#tTitle','Task');if(title===null)return;const obj={id,roomId:$('#tRoom').value,title,due:$('#tDue').value,status:$('#tStatus').value,priority:$('#tPriority').value},t=state.tasks.find(x=>x.id===id);if(t)Object.assign(t,obj);else state.tasks.push(obj);save();closeModal();render();toast('Task saved')}
function reopenTask(id){const t=state.tasks.find(x=>x.id===id);if(t){t.status='Open';save();render();toast('Task reopened')}}
function deleteTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;if(!confirm(`Delete task “${t.title}”?`))return;state.tasks=state.tasks.filter(x=>x.id!==id);save();render();toast('Task deleted')}
function openDecision(id){const d=id?state.decisions.find(x=>x.id===id):{id:uid(),roomId:defaultRoomId(),date:'',title:'',decision:'',impact:0};openModal(`<h2>${id?'Edit':'Log'} decision</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="decRoom">${roomOptions(d.roomId)}</select></div>${field('Decision title','decTitle',d.title,'text','maxlength="180"')}${field('Date — optional','decDate',d.date,'date')}${field('Cost impact (optional)','decImpact',d.impact,'number')}<div class="field full"><label>What was agreed?</label><textarea id="decText" maxlength="1200">${esc(d.decision)}</textarea></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDecision('${d.id}')">Save Decision</button></div>`)}
function saveDecision(id){const title=requireText('#decTitle','Decision title');if(title===null)return;const decision=requireText('#decText','Decision');if(decision===null)return;const impact=anyNumber('#decImpact','Cost impact');if(impact===null)return;const obj={id,roomId:$('#decRoom').value,date:$('#decDate').value,title,decision,impact},d=state.decisions.find(x=>x.id===id);if(d)Object.assign(d,obj);else state.decisions.push(obj);save();closeModal();render();toast('Decision saved')}
function deleteDecision(id){const d=state.decisions.find(x=>x.id===id);if(!d)return;if(!confirm(`Delete decision “${d.title}”?`))return;state.decisions=state.decisions.filter(x=>x.id!==id);save();render();toast('Decision deleted')}
function openDefect(id){const d=id?state.defects.find(x=>x.id===id):{id:uid(),roomId:defaultRoomId(),title:'',owner:'',status:'Open',raised:''};openModal(`<h2>${id?'Edit':'Add'} defect</h2><div class="formgrid"><div class="field"><label>Room / project</label><select id="dfRoom">${roomOptions(d.roomId)}</select></div>${field('Defect','dfTitle',d.title,'text','maxlength="220"')}${partyInput('Owner / contractor','dfOwner',d.owner,true)}${field('Raised date — optional','dfRaised',d.raised,'date')}<div class="field"><label>Status</label><select id="dfStatus"><option ${d.status==='Open'?'selected':''}>Open</option><option ${d.status==='Resolved'?'selected':''}>Resolved</option></select></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDefect('${d.id}')">Save Defect</button></div>`)}

function renderInsights(){const rooms=realRooms(),biggest=rooms.map(r=>({name:r.name,v:roomForecast(r.id)-r.budget})).sort((a,b)=>b.v-a.v),contractorSpend={};state.payments.filter(x=>x.status==='Paid').forEach(p=>contractorSpend[p.payee]=(contractorSpend[p.payee]||0)+p.amount);const roomRows=biggest.length?biggest.map(x=>`<div class="metricline"><span>${esc(x.name)}</span><strong class="money ${x.v>0?'bad':'good'}">${x.v>0?'+':''}${money(x.v)}</strong></div>`).join(''):'<div class="empty">No room allocations yet. Add rooms to see budget pressure.</div>';const spendRows=Object.entries(contractorSpend).length?Object.entries(contractorSpend).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="metricline"><span>${esc(n)}</span><strong>${money(v)}</strong></div>`).join(''):'<div class="empty">No payment data yet. Add or mark a payment paid to see spend by payee.</div>';pageTitle('Insights','Dashboard insights — your exportable report is the Budget CSV');$('#view').innerHTML=`<div class="grid cols4"><div class="card kpi"><span class="kpiIcon">Δ</span><div class="label">Forecast movement</div><div class="value money ${forecastFinal()>plannedRoomTotal()?'bad':'good'}">${money(forecastFinal()-plannedRoomTotal())}</div><div class="note">Above original base plan</div></div><div class="card kpi"><span class="kpiIcon sage">%</span><div class="label">Budget committed</div><div class="value">${totalBudget()?Math.round(committedTotal()/totalBudget()*100):0}%</div><div class="note">Of approved budget</div></div><div class="card kpi"><span class="kpiIcon amber">◇</span><div class="label">Open selections</div><div class="value">${undecidedSelections().length}</div><div class="note">Still need decisions</div></div><div class="card kpi"><span class="kpiIcon">!</span><div class="label">Open defects</div><div class="value">${unresolvedDefects().length}</div><div class="note">Before handover</div></div></div><div class="grid cols2 section"><div class="card"><div class="eyebrow">Budget pressur // ---------- Backup integrity -------------------------------------------------
function validStateData(d){
  if(!d||typeof d!=='object'||!d.settings||!Array.isArray(d.rooms)||d.rooms.length<1)return false;
  const arrays=['rooms','contractors','commitments','quoteRequests','selections','variations','payments','tasks','decisions','deliveries','milestones','defects'];if(!arrays.every(k=>Array.isArray(d[k])))return false;
  if(!d.settings.projectName||!Number.isFinite(Number(d.settings.baseBudget))||!Number.isFinite(Number(d.settings.contingency)))return false;
  const roomIds=new Set(d.rooms.map(r=>r.id));if(roomIds.size!==d.rooms.length)return false;
  const contractorIds=new Set(d.contractors.map(c=>c.id));
  for(const k of ['commitments','quoteRequests','selections','variations','payments','tasks','decisions','deliveries','defects'])for(const x of d[k])if(x.roomId&&!roomIds.has(x.roomId))return false;
  for(const x of d.commitments)if(x.contractorId&&!contractorIds.has(x.contractorId))return false;
  for(const qr of d.quoteRequests){if(qr.selectedQuoteId&&!(qr.quotes||[]).some(q=>q.id===qr.selectedQuoteId))return false;for(const q of qr.quotes||[])if(q.contractorId&&!contractorIds.has(q.contractorId))return false}
  return true
}

<script>

  (state.deliveries||[]).forEach(x=>{if(!x.supplierContractorId){const c=contractorByName(x.supplier);if(c)x.supplierContractorId=c.id}});

// Backup validation now enforces the same domain rules as normal forms.
function validISODateOrBlank(v){if(v===null||v===undefined||v==='')return true;if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const [y,m,d]=v.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d}
function finiteAtLeastZero(v){return Number.isFinite(Number(v))&&Number(v)>=0}
function strOK(v,max=1200,required=false){if(v===null||v===undefined)return !required;if(typeof v!=='string')return false;const s=v.trim();return (!required||s.length>0)&&s.length<=max}
validStateData=function(d){
  if(!d||typeof d!=='object'||!d.settings)return false;const arrays=['rooms','contractors','commitments','quoteRequests','selections','variations','payments','tasks','decisions','deliveries','milestones','defects'];if(!arrays.every(k=>Array.isArray(d[k])))return false;if(!d.rooms.length)return false;
  if(!strOK(d.settings.projectName,180,true)||!finiteAtLeastZero(d.settings.baseBudget)||!finiteAtLeastZero(d.settings.contingency))return false;if(!['AUD','USD','GBP','EUR'].includes(d.settings.currency||'AUD'))return false;if(d.settings.dateFormat&&!['DMY','MDY','LONG','ISO'].includes(d.settings.dateFormat))return false;if(!validISODateOrBlank(d.settings.startDate)||!validISODateOrBlank(d.settings.targetDate))return false;
  const roomIds=new Set(),contractorIds=new Set();for(const r of d.rooms){if(!strOK(r.id,120,true)||roomIds.has(r.id)||!strOK(r.name,100,true)||!finiteAtLeastZero(r.budget)||!Number.isFinite(Number(r.progress))||Number(r.progress)<0||Number(r.progress)>100)return false;roomIds.add(r.id)}
  for(const c of d.contractors){if(!strOK(c.id,120,true)||contractorIds.has(c.id)||!strOK(c.name,120,true)||!strOK(c.trade||'',100)||!strOK(c.phone||'',60)||!strOK(c.email||'',180))return false;if(c.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email))return false;contractorIds.add(c.id)}
  const roomRef=x=>!x.roomId||roomIds.has(x.roomId),contractorRef=id=>!id||contractorIds.has(id);
  for(const x of d.commitments){if(!roomRef(x)||!contractorRef(x.contractorId)||!finiteAtLeastZero(x.allowance)||!finiteAtLeastZero(x.amount)||!strOK(x.label,180,true)||!['Committed','Planned'].includes(x.status||'Committed'))return false}
  for(const qr of d.quoteRequests){if(!roomRef(qr)||!strOK(qr.scope,180,true)||!finiteAtLeastZero(qr.allowance)||!['Comparing','Selected'].includes(qr.status||'Comparing')||!Array.isArray(qr.quotes))return false;if(qr.selectedQuoteId&&!qr.quotes.some(q=>q.id===qr.selectedQuoteId))return false;for(const q of qr.quotes){if(!strOK(q.id,120,true)||!finiteAtLeastZero(q.amount)||!strOK(q.notes||'',600)||(!contractorRef(q.contractorId)))return false}}
  for(const x of d.selections){if(!roomRef(x)||!contractorRef(x.supplierContractorId)||!strOK(x.item,180,true)||!strOK(x.supplier||'',180)||!finiteAtLeastZero(x.allowance)||!finiteAtLeastZero(x.price)||!['Shortlisted','Selected','Ordered','Received','Installed'].includes(x.status)||!validISODateOrBlank(x.due))return false}
  for(const x of d.variations){if(!roomRef(x)||!strOK(x.title,180,true)||!Number.isFinite(Number(x.amount))||!Number.isFinite(Number(x.days))||!['Pending','Approved','Rejected'].includes(x.status)||!validISODateOrBlank(x.date)||!strOK(x.notes||'',1200))return false}
  for(const x of d.payments){if(!roomRef(x)||!contractorRef(x.contractorId)||!strOK(x.payeeDisplayName||x.payee||'',120,true)||!strOK(x.label,180,true)||!finiteAtLeastZero(x.amount)||!['Due','Paid'].includes(x.status)||!validISODateOrBlank(x.due))return false}
  for(const x of d.tasks){if(!roomRef(x)||!strOK(x.title,180,true)||!['Open','Done'].includes(x.status)||!['High','Medium','Low'].includes(x.priority)||!validISODateOrBlank(x.due))return false}
  for(const x of d.decisions){if(!roomRef(x)||!strOK(x.title,180,true)||!strOK(x.decision,1200,true)||!Number.isFinite(Number(x.impact))||!validISODateOrBlank(x.date))return false}
  for(const x of d.deliveries){if(!roomRef(x)||!contractorRef(x.supplierContractorId)||!strOK(x.item,180,true)||!strOK(x.supplier||'',180)||!['Not ordered','Ordered','Received'].includes(x.status)||!validISODateOrBlank(x.due))return false}
  for(const x of d.milestones){if(!strOK(x.title,180,true)||!['Upcoming','Current','Done'].includes(x.status)||!validISODateOrBlank(x.date))return false}
  for(const x of d.defects){if(!roomRef(x)||!contractorRef(x.ownerContractorId)||!strOK(x.title,180,true)||!strOK(x.owner||'',180)||!['Open','Resolved'].includes(x.status)||!validISODateOrBlank(x.raised))return false}
  return true
};

  const paid=paidTotal(),forecast=forecastFinal(),buffer=contingencyLeft(),p=demoProgress();
  const body=p>=1?`<h3>You haven't spent ${money(forecast)} yet. You've already committed the renovation to it.</h3><p>Only <strong>${money(paid)}</strong> has left the bank, but chosen quotes, commitments, selections and approved variations already put the live forecast at <strong>${money(forecast)}</strong>. Bills haven't arrived yet. The financial decisions already have.</p><div class="demoDelta"><div class="demoDeltaBox"><span>What you've paid</span><strong>${money(paid)}</strong></div><div class="demoDeltaBox"><span>What you're committed to</span><strong>${money(forecast)}</strong></div><div class="demoDeltaBox result"><span>Real remaining buffer</span><strong>${money(buffer)}</strong></div></div><div class="actions section"><button class="btn terr" onclick="navTo('quotes')">Show me what happens when I choose a quote →</button></div>`:`<h3>Your bank says ${money(paid)} has been paid. What is this renovation already committed to?</h3><p>Pick your best estimate. The point isn't to be right — it's to expose the difference between cash paid and decisions already made.</p><div class="demoGuess"><button class="btn" onclick="demoRevealAnswer()">About ${money(30000)}</button><button class="btn" onclick="demoRevealAnswer()">About ${money(150000)}</button><button class="btn" onclick="demoRevealAnswer()">About ${money(200000)}</button></div>`;
  const html=`<div class="demoAha reveal" id="demoRevealBlock"><div><div class="ahaLabel">Aha #1 — REVEAL</div>${body}</div>${p>=1?`<div class="demoAhaNumbers"><div class="demoAhaNum"><span>Paid so far</span><strong>${money(paid)}</strong></div><div class="demoAhaNum"><span>Forecast final</span><strong>${money(forecast)}</strong></div><div class="demoAhaNum"><span>Buffer left</span><strong>${money(buffer)}</strong></div></div>`:''}</div>`;
  const trail=v.querySelector('.demoTrail');trail?.insertAdjacentHTML('afterend',html)
}
function demoAutomate(){
  const v=$('#view');if(!v)return;const qr=state.quoteRequests.find(q=>q.id==='qr4')||state.quoteRequests.find(q=>q.status==='Comparing');if(!qr)return;const sorted=[...qr.quotes].sort((a,b)=>a.amount-b.amount),low=sorted[0],high=sorted[sorted.length-1],spread=high.amount-low.amount;
  const html=`<div class="demoAha automate"><div><div class="ahaLabel">Aha #2 — AUTOMATE</div><h3>Choose a quote once. RenoMate updates the connected project math.</h3><p>The rear deck allowance is <strong>${money(qr.allowance)}</strong>. These quotes are <strong>${money(spread)}</strong> apart. Select either option below and watch the forecast and remaining buffer update automatically.</p><div class="demoFriction"><div class="demoFrictionBox"><strong>Without RenoMate</strong>Quote sheet → room budget → project forecast → contingency → update manually</div><div class="demoFrictionArrow">→</div><div class="demoFrictionBox"><strong>With RenoMate</strong>Choose quote → connected numbers update</div></div></div><div class="demoAhaNumbers"><div class="demoAhaNum"><span>Allowance</span><strong>${money(qr.allowance)}</strong></div><div class="demoAhaNum"><span>Lowest quote</span><strong>${money(low.amount)}</strong></div><div class="demoAhaNum"><span>Highest quote</span><strong>${money(high.amount)}</strong></div></div></div>`;
  const trail=v.querySelector('.demoTrail');trail?.insertAdjacentHTML('afterend',html);const arena=[...v.querySelectorAll('.quoteArena')].find(x=>x.textContent.includes(qr.scope));arena?.classList.add('demoTry');
}
function demoAdvise(){
  const v=$('#view');if(!v)return;const pending=state.variations.find(x=>x.status==='Pending');if(!pending)return;const before=contingencyLeft(),after=before-(Number(pending.amount)||0),pct=before>0?Math.round((Number(pending.amount)||0)/before*100):100;const undecided=undecidedSelections(),allowances=undecided.reduce((a,b)=>a+(Number(b.allowance)||0),0);
  const html=`<div class="demoAha advise"><div><div class="ahaLabel">Aha #3 — ADVISE</div><h3>This ${money(pending.amount)} upgrade would consume ${pct}% of the buffer you have left.</h3><p>Before you approve <strong>${esc(pending.title)}</strong>, RenoMate connects today's decision to the rest of the project: the buffer would move from <strong>${money(before)}</strong> to <strong>${money(after)}</strong>.</p><div class="demoAdviceNote"><strong>And this isn't your last decision:</strong> ${undecided.length} selections are still undecided, carrying ${money(allowances)} of allowances.</div><div class="demoFriction"><div class="demoFrictionBox"><strong>Without RenoMate</strong>Record variation → update total → recalculate contingency → check outstanding selections</div><div class="demoFrictionArrow">→</div><div class="demoFrictionBox"><strong>With RenoMate</strong>See the consequence before you approve it</div></div></div><div class="demoAhaNumbers"><div class="demoAhaNum"><span>Buffer now</span><strong>${money(before)}</strong></div><div class="demoAhaNum"><span>If approved</span><strong>${money(after)}</strong></div><div class="demoAhaNum"><span>Still undecided</span><strong>${undecided.length}</strong></div></div></div>`;
  const trail=v.querySelector('.demoTrail');trail?.insertAdjacentHTML('afterend',html);const row=[...v.querySelectorAll('.variationRow')].find(x=>x.textContent.includes(pending.title));row?.classList.add('demoTry')
}

const _selectQuoteDemo=selectQuote;selectQuote=function(qrid,qid){const qr=state.quoteRequests.find(x=>x.id===qrid),q=qr?.quotes.find(x=>x.id===qid),beforeForecast=forecastFinal(),beforeBuffer=contingencyLeft();_selectQuoteDemo(qrid,qid);const afterForecast=forecastFinal(),afterBuffer=contingencyLeft();setDemoProgress(2);setTimeout(()=>{const delta=afterForecast-beforeForecast;openModal(`<div class="ahaLabel" style="color:#b75f3d">Aha #2 — AUTOMATE</div><h2>One choice changed the connected project numbers.</h2><p class="muted">You selected <strong>${esc(q?.contractor||'this quote')}</strong> at <strong>${money(q?.amount||0)}</strong> against a <strong>${money(qr?.allowance||0)}</strong> allowance.</p><div class="demoDelta"><div class="demoDeltaBox"><span>Before</span><strong>${money(beforeForecast)}</strong><div class="tiny">forecast</div></div><div class="demoDeltaBox"><span>Decision</span><strong>${money(q?.amount||0)}</strong><div class="tiny">${esc(q?.contractor||'selected quote')}</div></div><div class="demoDeltaBox result"><span>After</span><strong>${money(afterForecast)}</strong><div class="tiny">${delta<=0?money(Math.abs(delta))+' returned to buffer':money(delta)+' consumed from buffer'}</div></div></div><div class="callout sage section"><strong>Work RenoMate removed:</strong><div class="muted">No separate quote sheet, room-budget formula, master forecast or contingency calculation needed updating. Buffer moved from <strong>${money(beforeBuffer)}</strong> to <strong>${money(afterBuffer)}</strong> automatically.</div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Keep comparing</button><button class="btn terr" onclick="closeModal();navTo('variations')">Now test a variation →</button></div>`)},80)};

const _setVariationDemo=setVariation;setVariation=function(id,s){const v=state.variations.find(x=>x.id===id),beforeForecast=forecastFinal(),beforeBuffer=contingencyLeft(),undecided=undecidedSelections(),allowances=undecided.reduce((a,b)=>a+(Number(b.allowance)||0),0);_setVariationDemo(id,s);if(s==='Approved'||s==='Rejected'){setDemoProgress(3);setTimeout(()=>{const afterForecast=forecastFinal(),afterBuffer=contingencyLeft();openModal(`<div class="ahaLabel" style="color:#88600d">Aha #3 — ADVISE</div><h2>${s==='Approved'?'Decision recorded. You can see exactly what it cost your remaining flexibility.':'Decision recorded. The pending exposure is gone.'}</h2><div class="demoDelta"><div class="demoDeltaBox"><span>Before</span><strong>${money(beforeBuffer)}</strong><div class="tiny">buffer</div></div><div class="demoDeltaBox"><span>Decision</span><strong>${s==='Approved'?money(v?.amount||0):'Rejected'}</strong><div class="tiny">${esc(v?.title||'variation')}</div></div><div class="demoDeltaBox result"><span>After</span><strong>${money(afterBuffer)}</strong><div class="tiny">buffer remaining</div></div></div><div class="callout sage section"><strong>RenoMate also sees what comes next.</strong><div class="muted">You still have <strong>${undecided.length} undecided selections</strong> carrying <strong>${money(allowances)}</strong> of allowances. Today's variation is connected to tomorrow's choices, not isolated in a separate spreadsheet row.</div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Keep exploring</button><button class="btn terr" onclick="closeModal();demoBuy('aha-3')">Use RenoMate on my renovation →</button></div>`)},80)}};
